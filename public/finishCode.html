<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Maze Admin — Live View &amp; Quick Finish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>

  <!-- Firebase compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: #5c94fc;
      background-image:
        radial-gradient(ellipse 90px 50px at 10% 15%, #fff 50%, transparent 51%),
        radial-gradient(ellipse 65px 38px at 7% 15%, #fff 50%, transparent 51%),
        radial-gradient(ellipse 75px 44px at 13% 12%, #fff 50%, transparent 51%),
        radial-gradient(ellipse 110px 55px at 62% 10%, #fff 50%, transparent 51%),
        radial-gradient(ellipse 78px 42px at 59% 10%, #fff 50%, transparent 51%),
        radial-gradient(ellipse 88px 48px at 66% 7%, #fff 50%, transparent 51%);
      color: #231207;
      min-height: 100vh;
    }
    header {
      display:flex; align-items:center; gap:1rem; padding:12px 16px;
      background: #e52521;
      border-bottom: 3px solid #231207;
      box-shadow: 0 3px 0 #231207;
    }
    h1 {
      margin:0; font-size:11px; flex:1;
      font-family: 'Press Start 2P', monospace;
      color: #fff;
      text-shadow: 2px 2px 0 #231207;
    }
    .controls { display:flex; gap:8px; align-items:center; }
    button {
      background: #e8a000; color: #231207;
      border: 3px solid #231207; box-shadow: 2px 2px 0 #231207;
      padding: 8px 12px; border-radius: 4px; cursor:pointer; font-weight:700;
      font-family: 'Inter', sans-serif; font-size: 12px;
      transition: transform .05s, box-shadow .05s;
    }
    button:active { transform: translate(2px,2px); box-shadow: none; }
    button.warn { background: #e8a000; color: #231207; }
    button.danger { background: #e52521; color: #fff; }
    button.ghost { background: #fff; color: #231207; border: 3px solid #231207; }
    main { display:flex; gap:12px; padding:12px; height:calc(100vh - 56px); }
    .left { flex:1; overflow:auto; }
    .right { width:340px; flex-shrink:0; display:flex; flex-direction:column; gap:12px; }
    .panel {
      background: #fff;
      border: 3px solid #231207; box-shadow: 4px 4px 0 #231207;
      border-radius: 4px; padding:14px;
    }
    .panel-title {
      font-size: 8px; font-weight:700; color: #e52521;
      font-family: 'Press Start 2P', monospace;
      text-transform:uppercase; letter-spacing:.07em; margin-bottom:12px;
    }
    .participant {
      padding:10px; border-radius:4px; margin-bottom:8px;
      background: #f7f0dc;
      border: 2px solid #e0d4b8;
      display:flex; justify-content:space-between; gap:12px; align-items:center;
    }
    .participant.completed-row { background: #eaffea; border-color: #b8e0b8; }
    .name { font-weight:700; color: #231207; }
    .meta { color: #8b6040; font-size:0.85rem; }
    .duration { font-size:0.95rem; font-variant-numeric:tabular-nums; color: #231207; }
    .small { font-size:0.85rem; color: #8b6040; }
    .section-label {
      font-size:8px; font-weight:700; color: #e52521;
      font-family: 'Press Start 2P', monospace;
      text-transform:uppercase; letter-spacing:.07em; margin:8px 0 6px;
    }
    #completedSection { flex:1; overflow:auto; }
    input {
      flex:1; padding:8px 10px;
      border-radius:4px; border: 2px solid #231207;
      background: #fff; color: #231207;
      font-size:13px; font-family: 'Inter', sans-serif;
    }
    input:focus { outline: none; border-color: #e52521; box-shadow: 2px 2px 0 #e52521; }
  </style>
  <script src="/pw.js"></script>
</head>
<body>
  <header>
    <h1>Maze — Live (longest in maze at top)</h1>
    <div class="controls">
      <button id="refreshBtn" class="warn">Refresh</button>
    </div>
  </header>

  <main>
    <!-- In-maze list -->
    <div class="left panel">
      <div class="panel-title">Currently In Maze</div>
      <div id="list"></div>
    </div>

    <!-- Right: manual entry + recently completed -->
    <div class="right">
      <div class="panel">
        <div class="panel-title">Finish by Code</div>
        <div style="display:flex; gap:6px; align-items:center;">
          <input id="manualInput" placeholder="Enter participant code" style="flex:1; padding:8px; border-radius:4px; border:2px solid #231207; background:#fff; color:#231207; font-size:13px"/>
          <button id="manualFinish" style="background:#248a26; color:#fff; border:3px solid #231207; box-shadow:2px 2px 0 #231207; padding:8px 12px; border-radius:4px; white-space:nowrap; font-weight:700">Finish</button>
        </div>
        <div id="lastAction" class="small" style="margin-top:8px; min-height:18px;"></div>
      </div>

      <div class="panel" style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
        <div class="panel-title">Recently Completed</div>
        <div id="completedSection" style="overflow-y:auto; flex:1;"></div>
      </div>
    </div>
  </main>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBYsQCbHZ6r2KeqJ3-dgmFiR1mZ_IFZ-10",
    authDomain: "light-the-night-2025.firebaseapp.com",
    projectId: "light-the-night-2025",
    storageBucket: "light-the-night-2025.firebasestorage.app",
    messagingSenderId: "563168577950",
    appId: "1:563168577950:web:874ffc743c2f8a77b1ee8f",
    measurementId: "G-F4XJR2YT9K"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const listEl          = document.getElementById('list');
  const completedEl     = document.getElementById('completedSection');
  const refreshBtn      = document.getElementById('refreshBtn');
  const manualInput     = document.getElementById('manualInput');
  const manualFinish    = document.getElementById('manualFinish');
  const lastActionEl    = document.getElementById('lastAction');

  // ── helpers ──────────────────────────────────────────────
  function formatDuration(ms) {
    if (!ms || ms < 0) return '0s';
    const s = Math.floor(ms/1000);
    const hh = Math.floor(s/3600), mm = Math.floor((s%3600)/60), ss = s%60;
    if (hh > 0) return `${hh}h ${mm}m ${ss}s`;
    if (mm > 0) return `${mm}m ${ss}s`;
    return `${ss}s`;
  }
  function escapeHtml(s) {
    return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
  }
  function setLastAction(msg, ok=true) {
    lastActionEl.textContent = msg;
    lastActionEl.style.color = ok ? '#10b981' : '#ef4444';
    setTimeout(() => { lastActionEl.textContent = ''; }, 3000);
  }
  function normalizeStart(d) {
    let s = d.mazeStartTime || null;
    if (!s) return null;
    if (typeof s === 'string') return new Date(s);
    if (s.toDate) return s.toDate();
    return new Date(s);
  }

  // ── in-maze list ─────────────────────────────────────────
  let _liveTimer = null;

  async function fetchAndRender() {
    renderFromSnapshot();
  }

  // ── completed list ────────────────────────────────────────
  function fetchAndRenderCompleted(allItems) {
    const completed = (allItems || [])
      .filter(p => p.completed === true)
      .sort((a,b) => {
        const ta = a.completionTime?.toMillis?.() || 0;
        const tb = b.completionTime?.toMillis?.() || 0;
        return tb - ta; // most recent first
      })
      .slice(0, 20);

    completedEl.innerHTML = '';
    if (completed.length === 0) {
      completedEl.innerHTML = '<div class="small">No one finished yet.</div>';
      return;
    }
    completed.forEach(doc => {
      const name = doc.name || doc.displayName || 'Unnamed';
      const code = doc.barcode || doc.code || doc._id;
      const dur  = doc.durationMs != null ? formatDuration(doc.durationMs) : '—';
      const el   = document.createElement('div');
      el.className = 'participant completed-row';
      el.innerHTML = `
        <div>
          <div class="name" style="color:#6ee7b7">${escapeHtml(name)}</div>
          <div class="meta">${escapeHtml(code)}</div>
        </div>
        <div style="text-align:right">
          <div class="duration" style="color:#6ee7b7">${dur}</div>
          <button onclick="unfinishById('${escapeHtml(doc._id)}')" class="ghost danger" style="margin-top:4px; font-size:12px; padding:4px 8px; background:rgba(239,68,68,.12); color:#fca5a5; border:1px solid rgba(239,68,68,.25)">Unfinish</button>
        </div>`;
      completedEl.appendChild(el);
    });
  }

  refreshBtn.addEventListener('click', fetchAndRender);

  // ── finish ────────────────────────────────────────────────
  async function finishById(docIdOrCode) {
    let docRef = null;
    try {
      const tryDoc = await db.collection('kids').doc(docIdOrCode).get();
      if (tryDoc.exists) docRef = db.collection('kids').doc(docIdOrCode);
    } catch(e) {}

    if (!docRef) {
      const q = await db.collection('kids').where('barcode','==',docIdOrCode).limit(1).get();
      if (!q.empty) docRef = db.collection('kids').doc(q.docs[0].id);
    }
    if (!docRef) {
      const q2 = await db.collection('kids').where('code','==',docIdOrCode).limit(1).get();
      if (!q2.empty) docRef = db.collection('kids').doc(q2.docs[0].id);
    }
    if (!docRef) {
      setLastAction('Not found: ' + docIdOrCode, false);
      return;
    }

    const snap = await docRef.get();
    const data = snap.data();
    const startDate = normalizeStart(data);
    const now = new Date();
    const durationMs = startDate ? (now - startDate) : 0;

    await docRef.update({
      completed: true,
      completionTime: firebase.firestore.Timestamp.fromDate(now),
      mazeEndTime: firebase.firestore.Timestamp.fromDate(now),
      durationMs
    });

    setLastAction('Finished: ' + (data.name || docRef.id));
    // onSnapshot will fire automatically and re-render the lists
  }

  // ── unfinish ──────────────────────────────────────────────
  async function unfinishById(docId) {
    if (!confirm('Unfinish this participant? This removes their completion record.')) return;
    try {
      await db.collection('kids').doc(docId).update({
        completed: firebase.firestore.FieldValue.delete(),
        completionTime: firebase.firestore.FieldValue.delete(),
        mazeEndTime: firebase.firestore.FieldValue.delete(),
        durationMs: firebase.firestore.FieldValue.delete()
      });
      setLastAction('Unfinished.');
      // onSnapshot will fire automatically and re-render the lists
    } catch(e) {
      setLastAction('Error: ' + e.message, false);
    }
  }

  // ── manual entry ──────────────────────────────────────────
  manualFinish.addEventListener('click', () => {
    const val = manualInput.value.trim();
    if (!val) { setLastAction('Enter a code first.', false); return; }
    finishById(val);
    manualInput.value = '';
  });
  manualInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') manualFinish.click();
  });

  // ── boot — sign in anonymously, then listen live ─────────
  let _kidsSnapshot = {}; // docId → data, kept live by onSnapshot
  firebase.auth().signInAnonymously().then(() => {
    // Live listener — updates whenever any kid doc changes
    db.collection('kids').onSnapshot(snap => {
      _kidsSnapshot = {};
      snap.forEach(doc => { _kidsSnapshot[doc.id] = Object.assign({_id: doc.id}, doc.data()); });
      renderFromSnapshot();
    }, e => {
      listEl.innerHTML = '<div class="small" style="color:#ef4444">Read error: ' + e.message + '</div>';
    });
  }).catch(e => {
    listEl.innerHTML = '<div class="small" style="color:#ef4444">Auth failed: ' + e.message + '</div>';
  });

  function renderFromSnapshot() {
    const items = Object.values(_kidsSnapshot);
    renderInMaze(items);
    fetchAndRenderCompleted(items);
  }

  function renderInMaze(items) {
    const inMaze = items.filter(p => p.mazeStartTime && p.completed !== true)
      .map(p => {
        const startDate = normalizeStart(p);
        const startMs = startDate ? startDate.getTime() : 0;
        return { raw: p, startDate, startMs };
      })
      .sort((a, b) => a.startMs - b.startMs);

    if (_liveTimer) { clearInterval(_liveTimer); _liveTimer = null; }

    listEl.innerHTML = '';
    if (inMaze.length === 0) {
      listEl.innerHTML = '<div class="small">No participants currently in maze.</div>';
    } else {
      inMaze.forEach(p => {
        const doc = p.raw;
        const name = doc.name || doc.displayName || 'Unnamed';
        const code = doc.barcode || doc.code || doc._id;
        const el = document.createElement('div');
        el.className = 'participant';
        el.dataset.startMs = p.startMs;
        el.innerHTML = `
          <div>
            <div class="name">${escapeHtml(name)}</div>
            <div class="meta">${escapeHtml(code)}</div>
          </div>
          <div style="text-align:right">
            <div class="duration">${p.startMs ? formatDuration(Date.now() - p.startMs) : '—'}</div>
            <div class="small">${p.startDate ? p.startDate.toLocaleTimeString() : ''}</div>
            <button onclick="finishById('${escapeHtml(doc._id)}')" style="margin-top:4px; font-size:12px; padding:4px 8px;">Finish</button>
          </div>`;
        listEl.appendChild(el);
      });

      _liveTimer = setInterval(() => {
        listEl.querySelectorAll('.participant[data-start-ms]').forEach(el => {
          const ms = parseInt(el.dataset.startMs);
          const dur = el.querySelector('.duration');
          if (dur && ms) dur.textContent = formatDuration(Date.now() - ms);
        });
      }, 1000);
    }
  }
</script>
</body>
</html>
