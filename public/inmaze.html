<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Light the Night — In the Maze</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="/pw.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%; width: 100%;
    background: #5c94fc;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    color: #fff;
  }

  #bgCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    image-rendering: pixelated;
  }

  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
  }

  /* ── Header ── */
  .topbar {
    flex-shrink: 0;
    background: #e52521;
    border-bottom: 3px solid #231207;
    display: flex; align-items: center;
    padding: clamp(8px,1.4vh,14px) clamp(20px,3vw,40px);
    gap: 14px;
    position: relative;
    box-shadow: 0 3px 0 #1a0d04;
  }
  .topbar-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(11px, 1.8vw, 20px);
    color: #fff;
    text-shadow: 2px 2px 0 #231207;
    position: absolute; left: 50%; transform: translateX(-50%);
    white-space: nowrap;
    letter-spacing: .04em;
  }
  .topbar-count {
    margin-left: auto;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(8px, 1.2vw, 12px);
    color: #fff;
    background: rgba(0,0,0,.3);
    border: 2px solid rgba(255,255,255,.25);
    border-radius: 3px;
    padding: 5px 14px;
    white-space: nowrap;
  }
  .topbar-coin {
    display: inline-block;
    width: clamp(14px,2vw,20px);
    height: clamp(14px,2vw,20px);
    background: #e8a000; border: 2px solid #fff; border-radius: 50%;
    animation: coinSpin 1.2s steps(4) infinite; flex-shrink: 0;
  }
  @keyframes coinSpin {
    0%,100% { transform: scaleX(1); background: #e8a000; }
    25%,75%  { transform: scaleX(0.3); background: #c07800; }
    50%      { transform: scaleX(0.1); background: #c07800; }
  }

  /* ── Scroll area ── */
  .scroll-wrap {
    flex: 1; min-height: 0;
    overflow: hidden;
    position: relative;
  }
  .scroll-inner {
    position: absolute;
    width: 100%;
    will-change: transform;
    padding: clamp(10px,1.5vh,18px) 0 clamp(8px,1.2vh,14px);
  }

  /* ── Rows ── */
  .im-row {
    display: flex; align-items: center; gap: clamp(12px,2vw,28px);
    padding: clamp(12px,1.8vh,22px) clamp(20px,3vw,48px);
    border-bottom: 2px solid rgba(35,18,7,.12);
    background: rgba(255,255,255,.88);
    position: relative; overflow: hidden;
  }
  .im-row.im-row-alt { background: rgba(255,255,255,.72); }

  .im-dot {
    width: clamp(10px,1.4vw,16px); height: clamp(10px,1.4vw,16px);
    border-radius: 50%;
    background: #4cff50; box-shadow: 0 0 8px #4cff50;
    flex-shrink: 0; animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .im-name {
    font-weight: 800;
    font-size: clamp(16px, 2.6vw, 36px);
    color: #231207; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .im-powerups {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    font-size: clamp(24px, 3.6vw, 46px);
  }
  .im-powerups img {
    height: clamp(28px, 4.2vh, 52px); width: auto;
    image-rendering: pixelated;
    filter: drop-shadow(1px 1px 0 rgba(0,0,0,.35));
  }
  .im-coins {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(13px, 2.1vw, 26px);
    color: #e8a000; flex-shrink: 0;
    min-width: clamp(70px,9vw,130px); text-align: right;
  }
  .im-elapsed {
    font-size: clamp(15px, 2.1vw, 26px);
    font-weight: 800;
    color: #000; flex-shrink: 0;
    min-width: clamp(68px,9vw,120px); text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .empty-msg {
    padding: 60px 24px;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(10px,1.6vw,16px);
    color: #000;
    line-height: 2.2;
  }

</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="app">
  <div class="topbar">
    <span class="topbar-coin"></span>
    <div class="topbar-title">IN THE MAZE</div>
    <div class="topbar-count" id="countEl">0 players</div>
  </div>

  <div class="scroll-wrap" id="scrollWrap">
    <div class="scroll-inner" id="scrollInner">
      <div class="empty-msg">No one in maze yet</div>
    </div>
  </div>

</div>

<script>
// ── Background canvas ─────────────────────────────────────
(function(){
  const bc  = document.getElementById('bgCanvas');
  const bx  = bc.getContext('2d');
  const img = new Image();
  img.src   = 'mario-tiles.png';

  function drawCloud(cx, cy, ts){
    const L = Math.round(cx - ts * 1.5);
    const T = Math.round(cy - ts);
    [[176,160],[192,160],[208,160],[176,176],[192,176],[208,176]].forEach(([sx,sy],i)=>{
      bx.drawImage(img, sx, sy, 16, 16, L+(i%3)*ts, T+Math.floor(i/3)*ts, ts, ts);
    });
  }

  function draw(){
    const W = bc.width  = window.innerWidth;
    const H = bc.height = window.innerHeight;
    bx.imageSmoothingEnabled = false;
    bx.fillStyle = '#5c94fc';
    bx.fillRect(0, 0, W, H);
    const groundH = Math.round(H * 0.055);
    const gy = H - groundH;
    if(img.complete && img.naturalWidth > 0){
      const cs = Math.round(W * 0.065);
      drawCloud(W * 0.13, H * 0.12, cs);
      drawCloud(W * 0.50, H * 0.09, Math.round(cs * 1.2));
      drawCloud(W * 0.82, H * 0.14, Math.round(cs * 0.85));
      const gt   = Math.round(groundH / 2);
      const cols = Math.ceil(W / gt) + 1;
      for(let c = 0; c < cols; c++) bx.drawImage(img, 16, 0, 16, 16, c*gt, gy,    gt, gt);
      for(let c = 0; c < cols; c++) bx.drawImage(img,  0, 0, 16, 16, c*gt, gy+gt, gt, gt);
    } else {
      bx.fillStyle = '#c8601c';
      bx.fillRect(0, gy, W, groundH);
      bx.fillStyle = '#231207';
      bx.fillRect(0, gy, W, 3);
    }
  }

  img.onload = draw;
  draw();
  window.addEventListener('resize', draw);
})();

// ── Firebase ──────────────────────────────────────────────
firebase.initializeApp({
  apiKey:    "AIzaSyBYsQCbHZ6r2KeqJ3-dgmFiR1mZ_IFZ-10",
  authDomain:"light-the-night-2025.firebaseapp.com",
  projectId: "light-the-night-2025"
});
const db = firebase.firestore();

const countEl    = document.getElementById('countEl');
const scrollWrap = document.getElementById('scrollWrap');
const scrollInner= document.getElementById('scrollInner');

let _imActiveEventId = null;
db.collection('config').doc('config').onSnapshot(snap=>{
  const newId=(snap.data()||{}).activeEventId||null;
  if(newId!==_imActiveEventId){ _imActiveEventId=newId; render(); }
});

function fmtTime(ms) {
  if (!ms || ms < 0) return '0:00';
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── Auto-scroll ──────────────────────────────────────────
let scrollPos = 0, scrollAnim = null;
function stopScroll() {
  if (scrollAnim) { cancelAnimationFrame(scrollAnim); scrollAnim = null; }
  scrollPos = 0;
  scrollInner.style.transform = '';
}
function startScroll() {
  if (scrollAnim) cancelAnimationFrame(scrollAnim);
  function tick() {
    const half = scrollInner.scrollHeight / 2;
    scrollPos += 0.5;
    if (half > 0 && scrollPos >= half) scrollPos -= half;
    scrollInner.style.transform = `translateY(-${scrollPos}px)`;
    scrollAnim = requestAnimationFrame(tick);
  }
  scrollAnim = requestAnimationFrame(tick);
}
function maybeScroll() {
  if (scrollInner.scrollHeight > scrollWrap.clientHeight) {
    scrollInner.innerHTML += scrollInner.innerHTML;
    startScroll();
  } else {
    stopScroll();
  }
}

// ── Render ───────────────────────────────────────────────
let latestKids = [];


function render() {
  const inMaze = latestKids
    .filter(k => k.mazeStartTime && !k.mazeEndTime && (!_imActiveEventId || !k.eventId || k.eventId === _imActiveEventId))
    .sort((a, b) => {
      const ta = a.mazeStartTime?.toMillis?.() ?? 0;
      const tb = b.mazeStartTime?.toMillis?.() ?? 0;
      return tb - ta; // newest entry first
    });

  countEl.textContent = inMaze.length + (inMaze.length === 1 ? ' player' : ' players');

  if (!inMaze.length) {
    stopScroll();
    scrollInner.innerHTML = '<div class="empty-msg">No one in maze yet</div>';
    return;
  }

  const rows = inMaze.map((k, i) => {
    const startMs = _kidStartMs[k.id]?.localMs ?? Date.now();
    const _sc = s => Array.isArray(k.scans) && k.scans.some(x => x===s||(x&&typeof x==='object'&&x.station===s));
    const powerups = [
      _sc('land_ice')   ? `<span title="Ice Land">🧊</span>`   : '',
      _sc('land_water') ? `<span title="Water Land">🌊</span>` : '',
      _sc('land_fire')  ? `<span title="Fire Land">🔥</span>`  : '',
      _sc('land_lava')  ? `<span title="Lava Land">🌋</span>`  : '',
      k.savedPeach ? `<img src="icons/princess_peach.png" alt="Saved Peach" title="Rescued Princess Peach" style="height:clamp(42px,6.2vh,76px)">` : '',
      (k.collectedMushroom || k.usedMushroom) ? `<img src="icons/mushroom.png" alt="Mushroom" title="Used Mushroom" style="height:clamp(42px,6.2vh,76px)">` : '',
      (k.collectedShell || k.usedShell) ? `<img src="icons/red_shell.webp" alt="Red Shell" title="Red Shell" style="height:clamp(42px,6.2vh,76px)">` : '',
    ].join('');
    const alt = i % 2 === 1 ? ' im-row-alt' : '';
    return `<div class="im-row${alt}" data-start="${startMs}">
      <div class="im-dot"></div>
      <div class="im-name">${escHtml(k.name || '?')}</div>
      ${powerups ? `<div class="im-powerups">${powerups}</div>` : ''}
      <div class="im-coins"><img src="coin.svg" style="height:1em;width:auto;vertical-align:middle;image-rendering:pixelated"> ${k.coins ?? 0}</div>
      <div class="im-elapsed">${fmtTime(Date.now() - startMs)}</div>
    </div>`;
  }).join('');
  stopScroll();
  scrollInner.innerHTML = rows;
  requestAnimationFrame(() => maybeScroll());
}

// Tick elapsed times every second
setInterval(() => {
  scrollInner.querySelectorAll('[data-start]').forEach(row => {
    const ts = parseInt(row.dataset.start, 10);
    const ms = isNaN(ts) ? 0 : Date.now() - ts;
    const el = row.querySelector('.im-elapsed');
    if (el) el.textContent = fmtTime(ms);
  });
}, 1000);

// Per-kid start-time anchor on THIS device's clock.
// Avoids clock-drift between the station tablet (which writes mazeStartTime)
// and the display device (which computes Date.now() for the elapsed timer).
const _kidStartMs = {}; // kidId → { serverMs, localMs }

// Firestore listener
firebase.auth().signInAnonymously().catch(() => {});
firebase.auth().onAuthStateChanged(user => {
  if (!user) return;

  let _lbReloadTs = Number(sessionStorage.getItem('ltn_lb_reload_ts') || 0);
  db.collection('config').doc('leaderboardReloadBroadcast').onSnapshot(snap => {
    if (!snap.exists) return;
    const ts = snap.data().triggeredAt ? snap.data().triggeredAt.toMillis() : null;
    if (!ts || ts === _lbReloadTs) return;
    _lbReloadTs = ts;
    sessionStorage.setItem('ltn_lb_reload_ts', ts);
    if (Date.now() - ts > 30000) return;
    setTimeout(() => location.reload(), 500);
  });

  db.collection('kids').onSnapshot(snap => {
    const snapNow = Date.now();
    latestKids = [];
    snap.forEach(doc => {
      const d = doc.data();
      if (d.revoked) return;
      if (d.mazeStartTime && !d.mazeEndTime) {
        const serverMs = d.mazeStartTime?.toMillis?.() ??
          (d.mazeStartTime?.seconds ? d.mazeStartTime.seconds * 1000 : 0);
        const prev = _kidStartMs[doc.id];
        if (!prev || prev.serverMs !== serverMs) {
          // Honour server time if it's in the past on this device; if clock is
          // ahead on the station tablet (drift), anchor to right now so the
          // timer always starts at 0:00 and counts up.
          const localMs = serverMs > 0 && serverMs <= snapNow ? serverMs : snapNow;
          _kidStartMs[doc.id] = { serverMs, localMs };
        }
      } else {
        delete _kidStartMs[doc.id];
      }
      latestKids.push({ id: doc.id, ...d });
    });
    render();
  });
});
</script>
</body>
</html>
