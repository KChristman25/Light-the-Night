<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%; width: 100%;
    background: #5c94fc;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    color: #fff;
  }

  /* ── Background canvas (sky + SMB tiles) ── */
  #bgCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    image-rendering: pixelated;
  }

  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
  }

  /* ── Header ── */
  .topbar {
    flex-shrink: 0;
    background: #e52521;
    border-bottom: 3px solid #231207;
    display: flex; align-items: center;
    padding: clamp(8px,1.4vh,14px) clamp(20px,3vw,40px);
    gap: 14px;
    position: relative;
    box-shadow: 0 3px 0 #1a0d04;
  }
  .topbar-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(11px, 1.8vw, 20px);
    color: #fff;
    text-shadow: 2px 2px 0 #231207;
    position: absolute; left: 50%; transform: translateX(-50%);
    white-space: nowrap;
    letter-spacing: .04em;
  }
  .topbar-count {
    margin-left: auto;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(8px, 1.2vw, 12px);
    color: #fff;
    background: rgba(0,0,0,.3);
    border: 2px solid rgba(255,255,255,.25);
    border-radius: 3px;
    padding: 5px 14px;
    white-space: nowrap;
  }

  /* Spinning coin in topbar */
  .topbar-coin {
    display: inline-block;
    width: clamp(14px,2vw,20px);
    height: clamp(14px,2vw,20px);
    background: #e8a000;
    border: 2px solid #fff;
    border-radius: 50%;
    flex-shrink: 0;
    animation: coinSpin 1.2s steps(4) infinite;
  }
  @keyframes coinSpin {
    0%,100% { transform: scaleX(1);   background: #e8a000; }
    25%,75%  { transform: scaleX(0.3); background: #c07800; }
    50%      { transform: scaleX(0.1); background: #c07800; }
  }

  /* ── Scroll area ── */
  .scroll-wrap {
    flex: 1; min-height: 0;
    overflow: hidden;
    position: relative;
  }
  .scroll-inner {
    position: absolute;
    width: 100%;
    will-change: transform;
    padding: clamp(10px,1.5vh,18px) 0 clamp(8px,1.2vh,14px);
  }

  /* ── Rows ── */
  .lb-row {
    display: flex; align-items: center;
    gap: clamp(12px, 2vw, 28px);
    padding: clamp(12px,1.8vh,22px) clamp(20px,3vw,48px);
    border-bottom: 2px solid rgba(35,18,7,.12);
    background: rgba(255,255,255,.88);
    position: relative;
    overflow: hidden;
  }
  .lb-row.lb-row-alt { background: rgba(255,255,255,.72); }
  .lb-row.gold   { background: rgba(232,160,0,.82);   border-bottom-color: rgba(232,160,0,.6); }
  .lb-row.silver { background: rgba(192,192,192,.55); border-bottom-color: rgba(160,160,160,.4); }
  .lb-row.bronze { background: rgba(205,127,50,.45);  border-bottom-color: rgba(180,100,30,.35); }

  .lb-rank {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(10px, 1.6vw, 20px);
    flex-shrink: 0;
    min-width: clamp(28px,3.5vw,48px);
    text-align: right;
  }
  .lb-row.gold   .lb-rank { color: #e8a000; text-shadow: 1px 1px 0 #7a5000; }
  .lb-row.silver .lb-rank { color: #888; }
  .lb-row.bronze .lb-rank { color: #cd7f32; }
  .lb-rank.other { color: #aaa; }

  .lb-name {
    font-weight: 800;
    font-size: clamp(16px, 2.6vw, 36px);
    color: #231207; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .lb-time {
    font-size: clamp(15px, 2.1vw, 26px);
    font-weight: 800;
    color: #000; flex-shrink: 0;
    min-width: clamp(68px,9vw,120px); text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .lb-score {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(13px, 2.1vw, 26px);
    color: #e8a000; flex-shrink: 0;
    min-width: clamp(70px,9vw,130px); text-align: center;
  }

  .lb-badges {
    display: flex; align-items: center;
    gap: clamp(3px, 0.5vw, 7px);
    flex-shrink: 0;
  }

    height: clamp(28px, 4.2vh, 52px);

    image-rendering: pixelated;

    25%, 70% { opacity: 1; }

    100%     { opacity: 0; }

  @keyframes goldWipe {
    0%   { transform: translateX(-110%); }
    22%  { transform: translateX(0%);    }
    68%  { transform: translateX(0%);    }
    90%  { transform: translateX(110%);  }
    100% { transform: translateX(110%);  }

  .lb-row-new::after {
    content: '';
    position: absolute; inset: 0;
    z-index: 0; pointer-events: none;
    background: rgba(232,160,0,.45);

    animation: goldFlash 3.5s cubic-bezier(.4,0,.2,1) forwards;

      rgba(232, 160,  0, .82)     86%,

    );

<script>
// ── Background canvas ─────────────────────────────────────
(function(){
  const bc  = document.getElementById('bgCanvas');
  const bx  = bc.getContext('2d');
  const img = new Image();
  img.src   = 'mario-tiles.png';

  function drawCloud(cx, cy, ts){
    const L = Math.round(cx - ts * 1.5);
    const T = Math.round(cy - ts);
    [[176,160],[192,160],[208,160],[176,176],[192,176],[208,176]].forEach(([sx,sy],i)=>{
      bx.drawImage(img, sx, sy, 16, 16, L+(i%3)*ts, T+Math.floor(i/3)*ts, ts, ts);
    });
  }

  function draw(){
    const W = bc.width  = window.innerWidth;
    const H = bc.height = window.innerHeight;
    bx.imageSmoothingEnabled = false;
    bx.fillStyle = '#5c94fc';
    bx.fillRect(0, 0, W, H);
    const groundH = Math.round(H * 0.055);
    const gy = H - groundH;
    if(img.complete && img.naturalWidth > 0){
      const cs = Math.round(W * 0.065);
      drawCloud(W * 0.13, H * 0.12, cs);
      drawCloud(W * 0.50, H * 0.09, Math.round(cs * 1.2));
      drawCloud(W * 0.82, H * 0.14, Math.round(cs * 0.85));
      const gt   = Math.round(groundH / 2);
      const cols = Math.ceil(W / gt) + 1;
      for(let c = 0; c < cols; c++) bx.drawImage(img, 16, 0, 16, 16, c*gt, gy,    gt, gt);
      for(let c = 0; c < cols; c++) bx.drawImage(img,  0, 0, 16, 16, c*gt, gy+gt, gt, gt);
    } else {
      bx.fillStyle = '#c8601c';
      bx.fillRect(0, gy, W, groundH);
      bx.fillStyle = '#231207';
      bx.fillRect(0, gy, W, 3);
    }
  }

  img.onload = draw;
  draw();
  window.addEventListener('resize', draw);
})();

function fmtTime(ms) {
  if (!ms || ms < 0) return '0:00';
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function calcScore(coins) {
  return coins || 0;
}
function elapsedMs(item) {
  const s = item.mazeStartTime?.toMillis?.() ?? (item.mazeStartTime || 0);
  const e = item.mazeEndTime?.toMillis?.()   ?? (item.mazeEndTime   || 0);
  return e - s;
}

// ── State ────────────────────────────────────────────────
// committedList: finishers currently in the DOM, sorted score desc
// pendingQueue:  { item, queueDocId } — waiting to be inserted
// isLooped:      true after innerHTML is doubled for seamless scroll
let committedList = [], pendingQueue = [];
let animBusy = false, isLooped = false;
let scrollPos = 0, scrollAnim = null, _tickN = 0;
let _seamAt = 0;
let _firstHalfCount = 0; // lb-row count in first half — never changes while scrolling
const SCROLL_SPEED = 0.7;

// ── Row building ─────────────────────────────────────────
function buildRowEl(item, rank) {
  const s = item.mazeStartTime?.toMillis?.() ?? 0;
  const e = item.mazeEndTime?.toMillis?.()   ?? 0;
  const cls = ['gold','silver','bronze'][rank] || '';
  const rankStr = rank===0?'🥇':rank===1?'🥈':rank===2?'🥉':`#${rank+1}`;
  const bdgs = [];
  if (item.land_ice)   bdgs.push('<span style="font-size:2.6em">🧊</span>');
  if (item.land_water) bdgs.push('<span style="font-size:2.6em">🌊</span>');
  if (item.land_fire)  bdgs.push('<span style="font-size:2.6em">🔥</span>');
  if (item.land_lava)  bdgs.push('<span style="font-size:2.6em">🌋</span>');
  if (item.collectedShell) bdgs.push('<img src="icons/red_shell.webp" alt="Red Shell" style="height:clamp(42px,6.2vh,76px)">');
  if (item.savedPeach)     bdgs.push('<img src="icons/princess_peach.png" alt="Saved Peach" style="height:clamp(42px,6.2vh,76px)">');
  const el = document.createElement('div');
  const alt = rank % 2 === 1 ? ' lb-row-alt' : '';
  el.className = `lb-row${cls?' '+cls:''}${alt}`;
  el.dataset.id = item.id;
  el.innerHTML = `<div class="lb-rank ${rank<3?'':'other'}">${rankStr}</div>`
    + `<div class="lb-name">${escHtml(item.name||'?')}</div>`
    + (bdgs.length ? `<div class="lb-badges">${bdgs.join('')}</div>` : '')
    + `<div class="lb-time">${fmtTime(e-s)}</div>`
    + `<div class="lb-score"><img src="coin.svg" style="height:1em;width:auto;vertical-align:middle;image-rendering:pixelated;margin-right:4px"> ${item.coins ?? 0}</div>`;
  return el;
}

function rebuildAllRanks() {
  committedList.forEach((item, rank) => {
    const cls     = ['gold','silver','bronze'][rank] || '';
    const rankStr = rank===0?'🥇':rank===1?'🥈':rank===2?'🥉':`#${rank+1}`;
    scrollInner.querySelectorAll(`[data-id="${item.id}"]`).forEach(row => {
      const hasNew = row.classList.contains('lb-row-new');
      const alt = rank % 2 === 1 ? ' lb-row-alt' : '';
      row.className = `lb-row${cls?' '+cls:''}${alt}${hasNew?' lb-row-new':''}`;
      const rk = row.querySelector('.lb-rank');
      if (rk) { rk.className = `lb-rank ${rank<3?'':'other'}`; rk.textContent = rankStr; }
    });
  });
}

function _calcRank(item) {
  // 0-based index where item belongs in committedList (score desc, time asc, name asc)
  return committedList.filter(c =>
    c.score > item.score ||
    (c.score === item.score && elapsedMs(c) < elapsedMs(item)) ||
    (c.score === item.score && elapsedMs(c) === elapsedMs(item) && (c.name||'') < (item.name||''))
  ).length;
}

// ── Scroll ───────────────────────────────────────────────
function stopScroll() {
  if (scrollAnim) { cancelAnimationFrame(scrollAnim); scrollAnim = null; }
  scrollPos = 0; isLooped = false; _seamAt = 0; _firstHalfCount = 0;
  scrollInner.style.transform = '';
}

function _rebuildDOM() {
  scrollInner.innerHTML = committedList.map((k, i) => buildRowEl(k, i).outerHTML).join('');
}

const MAX_PER_REVOLUTION = 5;

// Try to absorb pending into the off-screen second half right now.
// Inserts rows surgically — no existing rows are removed, so no frame-blocking rebuild.
function _tryAddToSecondHalf() {
  if (!pendingQueue.length || !isLooped) return;
  if (scrollPos + scrollWrap.clientHeight >= _seamAt) return;

  // Absorb into committedList, tracking items (not ranks — ranks shift as we insert)
  const newItems = [];
  while (pendingQueue.length && newItems.length < MAX_PER_REVOLUTION) {
    const { item, queueDocId } = pendingQueue.shift();
    committedList.splice(_calcRank(item), 0, item);
    if (queueDocId) db.collection('leaderboardQueue').doc(queueDocId).delete().catch(() => {});
    newItems.push(item);
  }
  if (!newItems.length) return;
  countEl.textContent = committedList.length + (committedList.length === 1 ? ' finisher' : ' finishers');

  // Compute final ranks now that all insertions are done, sort ascending for correct DOM order
  const newRanks = newItems.map(it => committedList.indexOf(it)).sort((a, b) => a - b);
  const newRankSet = new Set(newRanks);
  const minRank = newRanks[0];

  const allRows = Array.from(scrollInner.querySelectorAll('.lb-row'));

  // Insert each new row at its correct second-half position
  for (const rank of newRanks) {
    const newRow = buildRowEl(committedList[rank], rank);
    scrollInner.insertBefore(newRow, allRows[_firstHalfCount + rank] || null);
    allRows.splice(_firstHalfCount + rank, 0, newRow); // keep array in sync for subsequent inserts
  }

  // Update rank label + class for existing rows shifted down by the insertions
  for (let r = minRank; r < committedList.length; r++) {
    if (newRankSet.has(r)) continue; // already built with correct rank
    const row = allRows[_firstHalfCount + r];
    if (!row) continue;
    const cls = ['gold','silver','bronze'][r] || '';
    const alt = r % 2 === 1 ? ' lb-row-alt' : '';
    const rankStr = r===0?'🥇':r===1?'🥈':r===2?'🥉':`#${r+1}`;
    row.className = `lb-row${cls?' '+cls:''}${alt}`;
    const rk = row.querySelector('.lb-rank');
    if (rk) { rk.className = `lb-rank ${r<3?'':'other'}`; rk.textContent = rankStr; }
  }
}

// At the seam: promote the old second half to first half (no DOM recreation),
// then clone it as the new second half. Avoids innerHTML mutation and row-height drift.
function _atSeam() {
  scrollAnim = null;
  scrollPos = 0; isLooped = false;

  // Remove old first-half rows — second half becomes the new first half
  const rows = Array.from(scrollInner.querySelectorAll('.lb-row'));
  for (let i = _firstHalfCount - 1; i >= 0; i--) { if (rows[i]) rows[i].remove(); }

  // Clone the surviving content (new first half) as the new second half
  const frag = document.createDocumentFragment();
  Array.from(scrollInner.childNodes).forEach(n => frag.appendChild(n.cloneNode(true)));
  scrollInner.appendChild(frag);

  isLooped = true;
  scrollInner.style.transform = 'translateY(0px)';
  _firstHalfCount = committedList.length;
  _seamAt = scrollInner.scrollHeight / 2;
  _tryAddToSecondHalf();
  requestAnimationFrame(maybeStartScroll);
}

function startScrollLoop() {
  if (scrollAnim) cancelAnimationFrame(scrollAnim);
  if (!isLooped) {
    const frag = document.createDocumentFragment();
    Array.from(scrollInner.childNodes).forEach(n => frag.appendChild(n.cloneNode(true)));
    scrollInner.appendChild(frag);
    isLooped = true;
    _firstHalfCount = committedList.length;
    _seamAt = scrollInner.scrollHeight / 2;
    _tryAddToSecondHalf();
  }
  function tick() {
    scrollPos += SCROLL_SPEED;
    if (_seamAt > 0 && scrollPos >= _seamAt) {
      scrollAnim = null;
      _atSeam();
      return;
    }
    scrollInner.style.transform = `translateY(-${scrollPos}px)`;
    scrollAnim = requestAnimationFrame(tick);
  }
  scrollAnim = requestAnimationFrame(tick);
}

function maybeStartScroll() {
  if (scrollAnim) return;
  // Require single-copy height > viewport. This guarantees _seamAt > viewport,
  // so _tryAddToSecondHalf always has a safe off-screen window at scrollPos=0.
  const singleH = isLooped ? scrollInner.scrollHeight / 2 : scrollInner.scrollHeight;
  if (singleH > scrollWrap.clientHeight) startScrollLoop();
}

// ── Queue processing (non-scrolling case only) ────────────
function _tryProcessQueue() {
  if (!pendingQueue.length || isLooped) return;
  while (pendingQueue.length) {
    const { item, queueDocId } = pendingQueue.shift();
    const rank = _calcRank(item);
    if (committedList.length === 0) {
      const empty = scrollInner.querySelector('.empty-msg');
      if (empty) empty.remove();
    }
    const all = Array.from(scrollInner.querySelectorAll('.lb-row'));
    scrollInner.insertBefore(buildRowEl(item, rank), all[rank] || null);
    committedList.splice(rank, 0, item);
    if (queueDocId) db.collection('leaderboardQueue').doc(queueDocId).delete().catch(() => {});
  }
  countEl.textContent = committedList.length + (committedList.length === 1 ? ' finisher' : ' finishers');
  rebuildAllRanks();
  requestAnimationFrame(maybeStartScroll);
}

// ── Initial render (no animation) ────────────────────────
const scrollWrap = document.getElementById('scrollWrap');

function _addLandFields(d) {
  const hasScan = id => Array.isArray(d.scans) && d.scans.some(s => s===id||(s&&s.station===id));
  return { ...d, land_ice: hasScan('land_ice'), land_water: hasScan('land_water'), land_fire: hasScan('land_fire'), land_lava: hasScan('land_lava') };
}

function initRender(kids) {
  const finishers = kids
    .filter(k => k.mazeEndTime)
    .map(k => ({ ..._addLandFields(k), score: calcScore(k.coins) }))
    .sort((a, b) => b.score - a.score || elapsedMs(a) - elapsedMs(b) || (a.name||'').localeCompare(b.name||''));
  committedList = finishers;
  countEl.textContent = finishers.length + (finishers.length===1?' finisher':' finishers');
  if (!finishers.length) {
    scrollInner.innerHTML = '<div class="empty-msg">No finishers yet…<br>be the first!</div>';
    return;
  }
  scrollInner.innerHTML = finishers.map((k,i) => buildRowEl(k,i).outerHTML).join('');
  requestAnimationFrame(maybeStartScroll);
}

const TEST_MAX = 50;
let _testInterval = null, _testCount = 0;

function _testAddOne() {
  if (_testCount >= TEST_MAX) return false;
  const idx  = _testCount++;
  const name = TEST_NAMES[idx % TEST_NAMES.length];
  const now  = Date.now(), dur = (10 + Math.random() * 35) * 60000;
  const endMs = now - Math.random() * 90000;
  const ts = ms => ({ toMillis: () => ms });
  const item = {
    id: `_test_${idx}`, name,
    coins: 50 + Math.floor(Math.random() * 251),
    mazeStartTime: ts(endMs - dur), mazeEndTime: ts(endMs),
    collectedMushroom: Math.random() > 0.5,
    collectedShell:    Math.random() > 0.6,
    savedPeach:   Math.random() > 0.7,
  };
  item.score = calcScore(item.coins);
  if (committedList.some(c => c.id === item.id) || pendingQueue.some(p => p.item.id === item.id)) return true;
  pendingQueue.push({ item, queueDocId: null });
  return true;
}
function _testAddAndProcess() {
  if (!_testAddOne()) { _testStop(); return; }
  if (!scrollAnim) _tryProcessQueue();
  else _tryAddToSecondHalf();
  const el = document.getElementById('_testCounter');
  if (el) el.textContent = `${_testCount} / ${TEST_MAX}`;
  if (_testCount >= TEST_MAX) _testStop();
}
function _testStart() {
  if (_testInterval) return;
  _testAddAndProcess();
  _testInterval = setInterval(_testAddAndProcess, 5000);
  document.getElementById('_testStartBtn').disabled = true;
  const t = document.getElementById('_testStopBtn');
  t.disabled = false; t.style.opacity = '1';
}
function _testStop() {
  clearInterval(_testInterval); _testInterval = null;
  const s = document.getElementById('_testStartBtn');
  const t = document.getElementById('_testStopBtn');
  if (s) s.disabled = (_testCount >= TEST_MAX);
  if (t) { t.disabled = true; t.style.opacity = '.45'; }
}
function _testReset() {
  _testStop(); _testCount = 0;
  committedList = []; pendingQueue = [];
  animBusy = false; isLooped = false;
  stopScroll();
  scrollInner.innerHTML = '<div class="empty-msg">No finishers yet…<br>be the first!</div>';
  countEl.textContent = '0 finishers';
  const el = document.getElementById('_testCounter');
  if (el) el.textContent = `0 / ${TEST_MAX}`;
  const s = document.getElementById('_testStartBtn');
  if (s) s.disabled = false;
}

// ── Firebase ─────────────────────────────────────────────
firebase.auth().signInAnonymously().catch(() => {});
firebase.auth().onAuthStateChanged(user => {
  if (!user) return;

  let _lbReloadTs = Number(sessionStorage.getItem('ltn_lb_reload_ts') || 0);
  db.collection('config').doc('leaderboardReloadBroadcast').onSnapshot(snap => {
    if (!snap.exists) return;
    const ts = snap.data().triggeredAt ? snap.data().triggeredAt.toMillis() : null;
    if (!ts || ts === _lbReloadTs) return;
    _lbReloadTs = ts;
    sessionStorage.setItem('ltn_lb_reload_ts', ts);
    if (Date.now() - ts > 30000) return;
    setTimeout(() => location.reload(), 500);
  });

  // One-time load of existing finishers — renders immediately, no animation
  db.collection('kids').get().then(snap => {
    const kids = [];
    snap.forEach(doc => {
      const d = doc.data();
      if (!d.revoked) kids.push({ id: doc.id, ...d });
    });
    initRender(kids);

    // Watch kids for changes — add new finishers to queue; rebuild on reset/removal
    db.collection('kids').onSnapshot(snap => {
      let needsRebuild = false;

      snap.docChanges().forEach(change => {
        const id = change.doc.id;

        if (change.type === 'removed') {
          if (committedList.some(c => c.id === id)) needsRebuild = true;
          return;
        }

        const d = change.doc.data();

        // Doc modified and lost its mazeEndTime (re-run, unfinish, or reset)
        if (change.type === 'modified' && !d.mazeEndTime) {
          if (committedList.some(c => c.id === id)) needsRebuild = true;
          return;
        }

        if (!d.mazeEndTime || d.revoked) return;

        // Already on leaderboard — update coins/badges in-place
        const existingIdx = committedList.findIndex(c => c.id === id);
        if (existingIdx !== -1) {
          committedList[existingIdx] = {
            ...committedList[existingIdx],
            coins: d.coins ?? committedList[existingIdx].coins,
            savedPeach: !!d.savedPeach,
            collectedShell: !!d.collectedShell,
            collectedMushroom: !!d.collectedMushroom,
            land_ice:   Array.isArray(d.scans)&&d.scans.some(s=>s==='land_ice'  ||(s&&s.station==='land_ice')),
            land_water: Array.isArray(d.scans)&&d.scans.some(s=>s==='land_water'||(s&&s.station==='land_water')),
            land_fire:  Array.isArray(d.scans)&&d.scans.some(s=>s==='land_fire' ||(s&&s.station==='land_fire')),
            land_lava:  Array.isArray(d.scans)&&d.scans.some(s=>s==='land_lava' ||(s&&s.station==='land_lava')),
            score: calcScore(d.coins)
          };
          scrollInner.querySelectorAll(`.lb-row[data-id="${id}"]`).forEach(row => {
            row.replaceWith(buildRowEl(committedList[existingIdx], existingIdx));
          });
          return;
        }
        if (pendingQueue.some(p => p.item.id === id)) return;
        const item = {
          id, name: d.name, coins: d.coins || 0,
          mazeStartTime: d.mazeStartTime, mazeEndTime: d.mazeEndTime,
          savedPeach: !!d.savedPeach, collectedMushroom: !!d.collectedMushroom, collectedShell: !!d.collectedShell,
          land_ice:   Array.isArray(d.scans)&&d.scans.some(s=>s==='land_ice'  ||(s&&s.station==='land_ice')),
          land_water: Array.isArray(d.scans)&&d.scans.some(s=>s==='land_water'||(s&&s.station==='land_water')),
          land_fire:  Array.isArray(d.scans)&&d.scans.some(s=>s==='land_fire' ||(s&&s.station==='land_fire')),
          land_lava:  Array.isArray(d.scans)&&d.scans.some(s=>s==='land_lava' ||(s&&s.station==='land_lava')),
          score: calcScore(d.coins)
        };
        pendingQueue.push({ item, queueDocId: null });
        if (!scrollAnim) _tryProcessQueue();
        else _tryAddToSecondHalf();
      });

      if (needsRebuild) {
        const kids = [];
        snap.forEach(doc => { const d = doc.data(); if (!d.revoked) kids.push({ id: doc.id, ...d }); });
        committedList = []; pendingQueue = [];
        stopScroll();
        initRender(kids);
      }
    });
  });
});
