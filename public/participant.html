<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="/favicon.png"/>
<title>Light the Night — Leaderboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%; width: 100%;
    background: #5c94fc;
    background-image:
      radial-gradient(ellipse 90px 48px at 10% 6%, #fff 50%, transparent 51%),
      radial-gradient(ellipse 65px 38px at  7% 6%, #fff 50%, transparent 51%),
      radial-gradient(ellipse 75px 44px at 14% 4%, #fff 50%, transparent 51%),
      radial-gradient(ellipse 130px 62px at 55%  4%, #fff 50%, transparent 51%),
      radial-gradient(ellipse  95px 52px at 51%  4%, #fff 50%, transparent 51%),
      radial-gradient(ellipse  75px 42px at 88% 5%, #fff 50%, transparent 51%),
      radial-gradient(ellipse  55px 34px at 85% 5%, #fff 50%, transparent 51%);
    background-attachment: fixed;
    font-family: 'Inter', system-ui, sans-serif;
    color: #231207;
    overflow: hidden;
  }

  /* ── Layout ──

  /* ── Layout ── */
  #app {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
  }

  /* ── Header ── */
  .topbar {
    flex-shrink: 0;
    background: #e52521;
    border-bottom: 3px solid #231207;
    display: flex; align-items: center; justify-content: center;
    padding: 10px 24px;
    gap: 16px;
  }
  .topbar-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(9px, 1.6vw, 14px);
    color: #fff;
    text-shadow: 2px 2px 0 #231207;
    line-height: 1.5;
  }
  .topbar-coin {
    display: inline-block;
    width: 14px; height: 14px;
    background: #e8a000; border: 2px solid #fff; border-radius: 50%;
    animation: coinSpin 1.2s steps(4) infinite; flex-shrink: 0;
  }
  @keyframes coinSpin {
    0%,100% { transform: scaleX(1); background: #e8a000; }
    25%,75%  { transform: scaleX(0.3); background: #c07800; }
    50%      { transform: scaleX(0.1); background: #c07800; }
  }

  /* ── Two-panel layout ── */
  .panels {
    flex: 1; min-height: 0;
    display: flex;
  }

  .panel-divider {
    width: 3px;
    background: rgba(232,160,0,.3);
    flex-shrink: 0;
  }

  .panel {
    display: flex; flex-direction: column;
    overflow: hidden;
    flex: 1;
  }

  .panel-header {
    flex-shrink: 0;
    padding: 10px 16px;
    background: #231207;
    border-bottom: 3px solid #e8a000;
    display: flex; align-items: center; gap: 10px;
  }
  .panel-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(7px, 1.2vw, 11px);
    color: #e8a000;
    text-shadow: 1px 1px 0 #000;
    flex: 1;
  }
  .panel-count {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(6px, 1vw, 9px);
    color: #fff;
    background: #3a1f0a;
    border: 1px solid #e8a000;
    border-radius: 3px;
    padding: 3px 8px;
  }

  .panel-scroll {
    flex: 1; min-height: 0;
    overflow: hidden;
    position: relative;
  }
  .panel-inner {
    position: absolute;
    width: 100%;
    will-change: transform;
  }

  /* ── Leaderboard rows ── */
  .lb-row {
    display: flex; align-items: center; gap: 10px;
    padding: clamp(8px,1.2vh,14px) clamp(10px,1.5vw,20px);
    border-bottom: 1px solid rgba(35,18,7,.15);
    background: rgba(255,255,255,.88);
    transition: background .2s;
  }
  .lb-row:nth-child(even) { background: rgba(255,255,255,.72); }
  .lb-row.gold   { background: rgba(232,160,0,.55); border-bottom-color: rgba(232,160,0,.4); }
  .lb-row.silver { background: rgba(192,192,192,.55); border-bottom-color: rgba(160,160,160,.4); }
  .lb-row.bronze { background: rgba(205,127,50,.45); border-bottom-color: rgba(180,100,30,.35); }

  .lb-rank {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(9px, 1.4vw, 14px);
    color: #e52521;
    min-width: clamp(24px,3vw,36px);
    flex-shrink: 0;
  }
  .lb-rank.r1 { color: #e8a000; }
  .lb-rank.r2 { color: #888; }
  .lb-rank.r3 { color: #cd7f32; }

  .lb-name {
    font-weight: 700;
    font-size: clamp(12px, 1.6vw, 17px);
    color: #231207;
    flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lb-badges { display: flex; align-items: center; gap: clamp(3px,0.5vw,6px); flex-shrink: 0; }
  .lb-badge { font-size: clamp(13px, 1.6vw, 18px); line-height: 1; opacity: 0.18; transition: opacity .2s; }
  .lb-badge.earned { opacity: 1; }

  .lb-coins {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(8px, 1.2vw, 12px);
    color: #e8a000;
    flex-shrink: 0;
    text-align: right;
    min-width: clamp(52px,7vw,80px);
  }
  .lb-time {
    font-size: clamp(10px, 1.2vw, 13px);
    color: #7a5c44;
    flex-shrink: 0;
    min-width: clamp(44px,6vw,70px);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ── In-maze rows ── */
  .im-row {
    display: flex; align-items: center; gap: 10px;
    padding: clamp(8px,1.2vh,14px) clamp(10px,1.5vw,20px);
    border-bottom: 1px solid rgba(35,18,7,.15);
    background: rgba(255,255,255,.88);
  }
  .im-row:nth-child(even) { background: rgba(255,255,255,.72); }
  .im-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4cff50; box-shadow: 0 0 6px #4cff50;
    flex-shrink: 0; animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .im-name {
    font-weight: 700;
    font-size: clamp(12px, 1.6vw, 17px);
    color: #231207; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .im-coins {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(8px, 1.2vw, 11px);
    color: #e8a000; flex-shrink: 0;
    min-width: clamp(44px,6vw,68px); text-align: right;
  }
  .im-elapsed {
    font-size: clamp(10px, 1.1vw, 13px);
    color: #7a5c44; flex-shrink: 0;
    min-width: clamp(40px,5.5vw,64px); text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .empty-msg {
    padding: 32px 20px;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(8px,1.2vw,11px);
    color: #7a5c44;
    line-height: 2;
  }

  .lb-row.follow, .im-row.follow {
    background: rgba(232,160,0,.6) !important;
    outline: 3px solid #e8a000;
    outline-offset: -3px;
  }

  /* ── Ground bar ── */
  .ground {
    flex-shrink: 0;
    height: 14px;
    background: #c8601c;
    border-top: 3px solid #231207;
  }

</style>
</head>
<body>

<!-- Main app -->
<div id="app">
  <div class="topbar">
    <span class="topbar-coin"></span>
    <div class="topbar-title">Light the Night 2026 — Live Leaderboard</div>
    <span class="topbar-coin"></span>
  </div>


  <div class="panels">
    <!-- LEFT: In Maze -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">🌟 IN MAZE</div>
        <div class="panel-count" id="imCount">0</div>
      </div>
      <div class="panel-scroll" id="imScroll">
        <div class="panel-inner" id="imInner">
          <div class="empty-msg">Nobody in the maze yet…</div>
        </div>
      </div>
    </div>

    <div class="panel-divider"></div>

    <!-- RIGHT: Finished leaderboard -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">🏁 FINISHERS</div>
        <div class="panel-count" id="lbCount">0</div>
      </div>
      <div class="panel-scroll" id="lbScroll">
        <div class="panel-inner" id="lbInner">
          <div class="empty-msg">No finishers yet…<br>Be the first!</div>
        </div>
      </div>
    </div>
  </div>

  <div class="ground"></div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBYsQCbHZ6r2KeqJ3-dgmFiR1mZ_IFZ-10",
  authDomain: "light-the-night-2025.firebaseapp.com",
  projectId: "light-the-night-2025",
  storageBucket: "light-the-night-2025.firebasestorage.app",
  messagingSenderId: "563168577950",
  appId: "1:563168577950:web:874ffc743c2f8a77b1ee8"
});
const db   = firebase.firestore();
const auth = firebase.auth();

boot();

/* ── Helpers ── */
function fmtTime(ms) {
  if (!ms || ms < 0) return '—';
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${m}:${String(r).padStart(2,'0')}`;
}

function calcScore(coins) {
  return coins || 0;
}

function elapsedMs(mazeStartTime) {
  if (!mazeStartTime) return null;
  const startMs = mazeStartTime.toMillis ? mazeStartTime.toMillis() : mazeStartTime;
  return Date.now() - startMs;
}

/* ── Scrolling ── */
function makeScroller(scrollEl, innerEl) {
  let pos = 0;
  let anim = null;
  let paused = false;

  function getContentH() { return innerEl.scrollHeight; }
  function getViewH()    { return scrollEl.clientHeight; }

  function tick() {
    if (paused) { anim = requestAnimationFrame(tick); return; }
    const ch = getContentH(), vh = getViewH();
    if (ch <= vh) { innerEl.style.transform = 'translateY(0)'; anim = requestAnimationFrame(tick); return; }
    pos += 0.4;
    if (pos >= ch - vh + 40) pos = 0;
    innerEl.style.transform = `translateY(${-pos}px)`;
    anim = requestAnimationFrame(tick);
  }

  scrollEl.addEventListener('pointerenter', () => { paused = true; });
  scrollEl.addEventListener('pointerleave', () => { paused = false; });

  anim = requestAnimationFrame(tick);
  return { reset() { pos = 0; } };
}

/* ── Boot & live data ── */
function boot() {
  auth.signInAnonymously().catch(()=>{});

  const lbInner  = document.getElementById('lbInner');
  const lbCount  = document.getElementById('lbCount');
  const lbScroll = document.getElementById('lbScroll');
  const imInner  = document.getElementById('imInner');
  const imCount  = document.getElementById('imCount');
  const imScroll = document.getElementById('imScroll');

  const lbScroller = makeScroller(lbScroll, lbInner);
  const imScroller = makeScroller(imScroll, imInner);

  let latestKids = [];

  db.collection('kids').onSnapshot(snap => {
    latestKids = [];
    snap.forEach(doc => {
      const d = doc.data();
      if (d.revoked) return;
      latestKids.push({ id: doc.id, ...d });
    });
    renderAll(latestKids);
  });

  function renderAll(kids) {
    // Finishers
    const finished = kids
      .filter(k => k.mazeEndTime)
      .map(k => {
        const startMs = k.mazeStartTime?.toMillis?.() ?? null;
        const endMs   = k.mazeEndTime?.toMillis?.()   ?? null;
        const durationMs = (startMs && endMs) ? endMs - startMs : null;
        return { ...k, durationMs, score: calcScore(k.coins) };
      })
      .sort((a, b) => b.score - a.score || (a.durationMs ?? Infinity) - (b.durationMs ?? Infinity));

    lbCount.textContent = finished.length;
    if (!finished.length) {
      lbInner.innerHTML = '<div class="empty-msg">No finishers yet…<br>Be the first!</div>';
    } else {
      lbInner.innerHTML = finished.map((k, i) => {
        const rank = i + 1;
        const rankClass = rank === 1 ? 'r1' : rank === 2 ? 'r2' : rank === 3 ? 'r3' : '';
        const rowClass  = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
        const rankStr   = rank <= 3 ? ['🥇','🥈','🥉'][rank-1] : `#${rank}`;
        const time      = k.durationMs ? fmtTime(k.durationMs) : '—';
        return `<div class="lb-row ${rowClass}">
          <div class="lb-rank ${rankClass}">${rankStr}</div>
          <div class="lb-name">${escHtml(k.name || '?')}</div>
          <div class="lb-badges">
            ${k.savedPeach?`<span class="lb-badge earned"><img src="icons/princess_peach.png" style="height:1em;width:auto;vertical-align:middle"></span>`:''}
            ${k.collectedShell?`<span class="lb-badge earned"><img src="icons/red_shell.webp" style="height:1em;width:auto;vertical-align:middle"></span>`:''}
          </div>
          <div class="lb-coins"><img src="coin.svg" style="height:1em;width:auto;vertical-align:middle;image-rendering:pixelated"> ${k.coins ?? 0}</div>
          <div class="lb-time">${time}</div>
        </div>`;
      }).join('');
    }
    lbScroller.reset();

    // In maze
    const inMaze = kids
      .filter(k => k.mazeStartTime && !k.mazeEndTime)
      .sort((a, b) => (b.coins ?? 0) - (a.coins ?? 0) || (a.name||'').localeCompare(b.name||''));

    imCount.textContent = inMaze.length;
    if (!inMaze.length) {
      imInner.innerHTML = '<div class="empty-msg">Nobody in the maze yet…</div>';
    } else {
      imInner.innerHTML = inMaze.map(k => `
        <div class="im-row">
          <div class="lb-name">${escHtml(k.name || '?')}</div>
          <div class="lb-coins"><img src="coin.svg" style="height:1em;width:auto;vertical-align:middle;image-rendering:pixelated"> ${k.coins ?? 0}</div>
        </div>`).join('');
    }
    imScroller.reset();
  }

}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

</script>
</body>
</html>
