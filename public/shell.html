<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Red Shell</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #e52521;
      font-family: 'Inter', sans-serif;
      color: #fff;
      overflow: hidden;
      user-select: none;
    }
    .page {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100vw; height: 100dvh; gap: clamp(8px,2vh,18px);
      padding: 16px;
    }
    .shell-icon { font-size: clamp(80px,20vw,160px); line-height: 1; animation: shellPulse 1.4s ease-in-out infinite; }
    @keyframes shellPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
    .title {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(22px,5.5vw,44px);
      color: #fff; text-shadow: 3px 3px 0 #900;
      text-align: center; line-height: 1.4;
    }
    .subtitle {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(9px,2.2vw,14px);
      color: #ffbbbb; text-align: center; line-height: 1.8;
    }
    /* Keypad */
    .keypad-display {
      display: flex; gap: clamp(8px,2vw,14px); margin: clamp(4px,1vh,10px) 0;
    }
    .ds {
      width: clamp(44px,11vw,64px); height: clamp(54px,13vw,76px);
      background: rgba(0,0,0,.35); border: 3px solid rgba(255,255,255,.5);
      border-radius: 4px; display: flex; align-items: center; justify-content: center;
      font-family: 'Press Start 2P', monospace; font-size: clamp(22px,5.5vw,36px);
      color: #fff; text-shadow: 1px 1px 0 #000;
    }
    .ds.filled { background: rgba(0,0,0,.55); border-color: #fff; }
    .keypad {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px,2vw,12px); width: min(320px, 90vw);
    }
    .key-btn {
      height: clamp(56px,14vw,80px);
      background: rgba(0,0,0,.3); border: 3px solid rgba(255,255,255,.4);
      border-radius: 4px; box-shadow: 0 4px 0 rgba(0,0,0,.4);
      font-family: 'Press Start 2P', monospace; font-size: clamp(18px,4.5vw,28px);
      color: #fff; cursor: pointer; transition: transform .08s, box-shadow .08s;
    }
    .key-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
    .key-clear { font-size: clamp(20px,5vw,30px); background: rgba(0,0,0,.45); }
    /* Overlays */
    .overlay {
      position: fixed; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 50;
      text-align: center; padding: 24px; gap: 16px;
    }
    .overlay.show { display: flex; }
    #successOverlay { background: #248a26; }
    #alreadyOverlay { background: #e8a000; }
    .ov-icon { font-size: clamp(60px,16vw,110px); }
    .ov-title { font-family:'Press Start 2P',monospace; font-size:clamp(18px,4.5vw,34px); color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,.4); line-height:1.5; }
    .ov-sub   { font-family:'Press Start 2P',monospace; font-size:clamp(9px,2vw,13px); color:rgba(255,255,255,.85); line-height:1.8; }
  </style>
  <script src="/pw.js"></script>
</head>
<body>
<div class="page" id="mainPage">
  <div class="shell-icon"><img src="icons/red_shell.webp" style="height:.8em;width:auto;vertical-align:middle"></div>
  <div class="title">RED SHELL!</div>
  <div class="subtitle" id="shellSubtitle">Your Reward: earn coins!<br>Other players each lose coins<br>🛡 Mushroom holders are protected</div>

  <div class="keypad-display" id="keypadDisplay">
    <div class="ds" id="ds0">_</div>
    <div class="ds" id="ds1">_</div>
    <div class="ds" id="ds2">_</div>
  </div>

  <div class="keypad" id="keypad">
    <button class="key-btn" data-key="1">1</button>
    <button class="key-btn" data-key="2">2</button>
    <button class="key-btn" data-key="3">3</button>
    <button class="key-btn" data-key="4">4</button>
    <button class="key-btn" data-key="5">5</button>
    <button class="key-btn" data-key="6">6</button>
    <button class="key-btn" data-key="7">7</button>
    <button class="key-btn" data-key="8">8</button>
    <button class="key-btn" data-key="9">9</button>
    <div></div>
    <button class="key-btn" data-key="0">0</button>
    <div></div>
  </div>
</div>

<!-- Success overlay -->
<div class="overlay" id="successOverlay">
  <div class="ov-icon"><img src="icons/red_shell.webp" style="height:.8em;width:auto;vertical-align:middle"></div>
  <div class="ov-title" id="successName">FIRED!</div>
  <div class="ov-sub" id="successSub">Everyone lost coins!</div>
</div>

<!-- Already used overlay -->
<div class="overlay" id="alreadyOverlay">
  <div class="ov-icon">⚠️</div>
  <div class="ov-title">ALREADY USED</div>
  <div class="ov-sub">You already fired a shell today!</div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyBYsQCbHZ6r2KeqJ3-dgmFiR1mZ_IFZ-10",
  authDomain: "light-the-night-2025.firebaseapp.com",
  projectId: "light-the-night-2025"
});
const db  = firebase.firestore();
const FSV = firebase.firestore.FieldValue;
const QUEUE_COL = db.collection('webswitch').doc('queueRoot').collection('queue');

let codeLength = 3;
let shellPenalty = 10;
let qlabShellCue = '';
let codeBuffer = '';

firebase.auth().signInAnonymously().then(()=>{
  db.collection('config').doc('config').get().then(s=>{
    if(!s.exists) return;
    const d = s.data()||{};
    if(d.codeLength >= 1) codeLength = d.codeLength;
    if(d.gameShellPenalty) shellPenalty = Number(d.gameShellPenalty);
    updateDisplay();
    const sub = document.getElementById('shellSubtitle');
    if(sub) sub.innerHTML = `Your Reward: +${shellPenalty} coins<br>Other players each lose ${shellPenalty} coins<br>🛡 Mushroom holders are protected`;
  }).catch(()=>{});
  db.collection('webswitch').doc('config').get().then(s=>{
    if(s.exists && s.data().shellQlabCue) qlabShellCue = s.data().shellQlabCue;
  }).catch(()=>{});
}).catch(()=>{});

function updateDisplay(){
  for(let i=0;i<3;i++){
    const slot=document.getElementById('ds'+i);
    if(!slot) continue;
    if(i<codeBuffer.length){slot.textContent=codeBuffer[i];slot.classList.add('filled');}
    else{slot.textContent='_';slot.classList.remove('filled');}
  }
}

function shakeDisplay(){
  const disp=document.getElementById('keypadDisplay');
  if(!disp) return;
  disp.style.transition='transform .05s';
  const shake=[6,-6,5,-5,3,-3,0]; let i=0;
  const next=()=>{if(i<shake.length){disp.style.transform=`translateX(${shake[i++]}px)`;setTimeout(next,50);}else{disp.style.transform='';disp.style.transition='';}};
  next();
}

document.getElementById('keypad').addEventListener('click', e=>{
  const btn = e.target.closest('.key-btn');
  if(!btn) return;
  const key = btn.dataset.key;
  if(/^\d$/.test(key) && codeBuffer.length < codeLength){
    codeBuffer += key; updateDisplay();
    if(codeBuffer.length === codeLength){ const c=codeBuffer; codeBuffer=''; updateDisplay(); submitCode(c); }
  }
});

async function submitCode(code){
  let docRef=null, kidData=null;
  try{const q=await db.collection('kids').where('barcode','==',code).orderBy('timestamp','desc').limit(1).get();if(!q.empty){docRef=q.docs[0].ref;kidData=q.docs[0].data();}}catch(_){}
  if(!docRef){try{const q=await db.collection('kids').where('code','==',code).orderBy('timestamp','desc').limit(1).get();if(!q.empty){docRef=q.docs[0].ref;kidData=q.docs[0].data();}}catch(_){}}
  if(!docRef){ shakeDisplay(); return; }

  if(kidData.usedShell){
    document.getElementById('alreadyOverlay').classList.add('show');
    setTimeout(()=>document.getElementById('alreadyOverlay').classList.remove('show'), 4000);
    return;
  }

  const name = kidData.name || kidData.displayName || 'Participant';

  try{
    // Give shooter their coins
    await docRef.update({ usedShell:true, coins:FSV.increment(shellPenalty) });
    await db.collection('scans').add({kidId:docRef.id, name, coins:shellPenalty, gameType:'shell_ipad', timestamp:firebase.firestore.Timestamp.now()});

    // Deduct from everyone else (skip shielded)
    const allKids = await db.collection('kids').get();
    const batch = db.batch(); let n=0, shielded=0;
    allKids.forEach(doc=>{
      if(doc.id===docRef.id) return;
      if(doc.data().shellShield){ batch.update(doc.ref,{shellShield:FSV.delete()}); shielded++; }
      else { batch.update(doc.ref,{coins:FSV.increment(-shellPenalty),frozen:true}); n++; }
    });
    if(n+shielded>0) await batch.commit();

    // Broadcast flash to all stations
    await db.collection('config').doc('shellBroadcast').set({
      triggeredAt: firebase.firestore.Timestamp.now(),
      by: docRef.id, byName: name,
      penalty: shellPenalty, affectedCount: n, shieldedCount: shielded
    });

    // QLab cue
    if(qlabShellCue){
      await QUEUE_COL.add({type:'osc', address:qlabShellCue, processed:false, ts:firebase.firestore.FieldValue.serverTimestamp()});
    }

    document.getElementById('successName').textContent = name + ' FIRED!';
    document.getElementById('successSub').textContent = n + ' player' + (n===1?'':'s') + ' lost ' + shellPenalty + ' coins!' + (shielded?' ('+shielded+' shielded)':'');
    document.getElementById('successOverlay').classList.add('show');
    setTimeout(()=>document.getElementById('successOverlay').classList.remove('show'), 5000);
  }catch(e){ console.error(e); shakeDisplay(); }
}
</script>
</body>
</html>
