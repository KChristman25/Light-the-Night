<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Light the Night — Split Leaderboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="/pw.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%; width: 100%;
    background: #5c94fc;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    color: #231207;
  }

  #bgCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    image-rendering: pixelated;
  }

  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
  }

  /* ── Header ── */
  .topbar {
    flex-shrink: 0;
    background: #e52521;
    border-bottom: 3px solid #231207;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(8px,1.2vh,14px) clamp(16px,2.5vw,32px);
    gap: 14px;
    position: relative;
  }
  .topbar-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(10px, 1.6vw, 16px);
    color: #fff;
    text-shadow: 2px 2px 0 #231207;
    letter-spacing: .04em;
  }
  .topbar-coin {
    display: inline-block;
    width: clamp(12px,1.8vw,18px); height: clamp(12px,1.8vw,18px);
    background: #e8a000; border: 2px solid #fff; border-radius: 50%;
    animation: coinSpin 1.2s steps(4) infinite; flex-shrink: 0;
  }
  @keyframes coinSpin {
    0%,100% { transform: scaleX(1); background: #e8a000; }
    25%,75%  { transform: scaleX(0.3); background: #c07800; }
    50%      { transform: scaleX(0.1); background: #c07800; }
  }

  /* ── Two-panel layout ── */
  .panels {
    flex: 1; min-height: 0;
    display: flex;
  }

  .panel-divider {
    width: 4px;
    background: rgba(35,18,7,.25);
    flex-shrink: 0;
  }

  .panel {
    display: flex; flex-direction: column;
    overflow: hidden;
    flex: 1;
  }

  .panel-header {
    flex-shrink: 0;
    padding: clamp(8px,1.2vh,14px) clamp(12px,2vw,24px);
    background: #231207;
    border-bottom: 3px solid #e8a000;
    display: flex; align-items: center; gap: 10px;
  }
  .panel-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(8px, 1.3vw, 13px);
    color: #e8a000;
    text-shadow: 1px 1px 0 #000;
    flex: 1;
    letter-spacing: .04em;
  }
  .panel-count {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(7px, 1vw, 10px);
    color: #fff;
    background: #3a1f0a;
    border: 1px solid #e8a000;
    border-radius: 3px;
    padding: 4px 10px;
    white-space: nowrap;
  }

  .panel-scroll {
    flex: 1; min-height: 0;
    overflow: hidden;
    position: relative;
  }
  .panel-inner {
    position: absolute; width: 100%;
    will-change: transform;
    padding-bottom: 12px;
  }

  /* ── Finisher rows ── */
  .lb-row {
    display: flex; align-items: center; gap: clamp(8px,1.2vw,16px);
    padding: clamp(9px,1.4vh,18px) clamp(12px,2vw,28px);
    border-bottom: 2px solid rgba(35,18,7,.1);
    background: rgba(255,255,255,.88);
    position: relative; overflow: hidden;
  }
  .lb-row:nth-child(even) { background: rgba(255,255,255,.7); }
  .lb-row.gold   { background: rgba(232,160,0,.52); border-bottom-color: rgba(200,130,0,.35); }
  .lb-row.silver { background: rgba(192,192,192,.52); border-bottom-color: rgba(160,160,160,.35); }
  .lb-row.bronze { background: rgba(205,127,50,.44); border-bottom-color: rgba(175,100,30,.3); }

  .lb-rank {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(10px, 1.6vw, 18px);
    color: #e52521;
    min-width: clamp(28px,3.5vw,48px);
    flex-shrink: 0; text-align: center;
  }
  .lb-rank.r1 { color: #e8a000; }
  .lb-rank.r2 { color: #888; }
  .lb-rank.r3 { color: #cd7f32; }
  .lb-rank.other { color: #aaa; }

  .lb-name {
    font-weight: 800;
    font-size: clamp(13px, 1.9vw, 24px);
    color: #231207;
    flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lb-badges { display: flex; align-items: center; gap: clamp(3px,0.4vw,6px); flex-shrink: 0; }
  .lb-badge { line-height: 1; }
  .lb-badge img { height: clamp(28px,4.2vh,52px); width: auto; image-rendering: pixelated; filter: drop-shadow(1px 1px 0 rgba(0,0,0,.3)); }
  .lb-badge-emoji { font-size: clamp(26px,3.8vh,48px); line-height: 1; }

  .lb-coins {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(9px, 1.3vw, 15px);
    color: #e8a000;
    flex-shrink: 0;
    min-width: clamp(56px,7vw,96px); text-align: right;
  }
  .lb-time {
    font-size: clamp(11px, 1.3vw, 15px);
    font-weight: 700;
    color: #4a3728;
    flex-shrink: 0;
    min-width: clamp(48px,6vw,80px); text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ── In-maze rows ── */
  .im-row {
    display: flex; align-items: center; gap: clamp(8px,1.2vw,16px);
    padding: clamp(9px,1.4vh,18px) clamp(12px,2vw,28px);
    border-bottom: 2px solid rgba(35,18,7,.1);
    background: rgba(255,255,255,.88);
    overflow: hidden; position: relative;
  }
  .im-row:nth-child(even) { background: rgba(255,255,255,.7); }

  .im-dot {
    width: clamp(8px,1.1vw,12px); height: clamp(8px,1.1vw,12px);
    border-radius: 50%;
    background: #4cff50; box-shadow: 0 0 8px #4cff50;
    flex-shrink: 0; animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .im-name {
    font-weight: 800;
    font-size: clamp(13px, 1.9vw, 24px);
    color: #231207; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .im-powerups {
    display: flex; align-items: center; gap: clamp(3px,0.4vw,6px);
    flex-shrink: 0;
  }
  .im-powerups img {
    height: clamp(28px,4.2vh,52px); width: auto;
    image-rendering: pixelated;
    filter: drop-shadow(1px 1px 0 rgba(0,0,0,.3));
  }
  .im-powerups span { font-size: clamp(26px,3.8vh,48px); line-height:1; }

  .im-coins {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(9px, 1.3vw, 14px);
    color: #e8a000; flex-shrink: 0;
    min-width: clamp(50px,6.5vw,88px); text-align: right;
  }
  .im-elapsed {
    font-size: clamp(11px, 1.3vw, 15px);
    font-weight: 700;
    color: #4a3728; flex-shrink: 0;
    min-width: clamp(44px,5.5vw,72px); text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .empty-msg {
    padding: clamp(32px,5vh,56px) 24px;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(9px,1.4vw,13px);
    color: #7a5c44;
    line-height: 2.2;
  }

  /* ── Ground bar ── */
  .ground {
    flex-shrink: 0;
    height: clamp(10px,1.4vh,16px);
    background: #c8601c;
    border-top: 3px solid #231207;
  }

  /* ── Gold wipe animation (new finisher) ── */
  @keyframes goldFlash {
    0%, 15%  { opacity: 0; }
    25%, 70% { opacity: 1; }
    90%      { opacity: 1; }
    100%     { opacity: 0; }
  }
  @keyframes goldWipe {
    0%   { transform: translateX(-110%); }
    22%  { transform: translateX(0%);    }
    68%  { transform: translateX(0%);    }
    90%  { transform: translateX(110%);  }
    100% { transform: translateX(110%);  }
  }
  .lb-row-new::after {
    content: '';
    position: absolute; inset: 0;
    z-index: 0; pointer-events: none;
    background: rgba(232,160,0,.45);
    opacity: 0;
    animation: goldFlash 3.5s cubic-bezier(.4,0,.2,1) forwards;
  }
  .lb-row-new::before {
    content: '';
    position: absolute; inset: 0;
    z-index: 1; pointer-events: none;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(232,160,0,.82) 14%,
      rgba(255,218,30,.97) 38%,
      rgba(255,244,100,1) 50%,
      rgba(255,218,30,.97) 62%,
      rgba(232,160,0,.82) 86%,
      transparent 100%
    );
    animation: goldWipe 3.5s cubic-bezier(.4,0,.2,1) forwards;
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="app">
  <div class="topbar">
    <span class="topbar-coin"></span>
    <div class="topbar-title">LIGHT THE NIGHT — LIVE LEADERBOARD</div>
    <span class="topbar-coin"></span>
  </div>

  <div class="panels">
    <!-- LEFT: In Maze -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">🌟 IN THE MAZE</div>
        <div class="panel-count" id="imCount">0</div>
      </div>
      <div class="panel-scroll" id="imScroll">
        <div class="panel-inner" id="imInner">
          <div class="empty-msg">Nobody in the maze yet…</div>
        </div>
      </div>
    </div>

    <div class="panel-divider"></div>

    <!-- RIGHT: Finishers -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">🏁 FINISHERS</div>
        <div class="panel-count" id="lbCount">0</div>
      </div>
      <div class="panel-scroll" id="lbScroll">
        <div class="panel-inner" id="lbInner">
          <div class="empty-msg">No finishers yet…<br>Be the first!</div>
        </div>
      </div>
    </div>
  </div>

  <div class="ground"></div>
</div>

<script>
// ── Background ────────────────────────────────────────────────
(function(){
  const bc = document.getElementById('bgCanvas');
  const bx = bc.getContext('2d');
  const img = new Image(); img.src = 'mario-tiles.png';
  function drawCloud(cx,cy,ts){
    const L=Math.round(cx-ts*1.5),T=Math.round(cy-ts);
    [[176,160],[192,160],[208,160],[176,176],[192,176],[208,176]].forEach(([sx,sy],i)=>{
      bx.drawImage(img,sx,sy,16,16,L+(i%3)*ts,T+Math.floor(i/3)*ts,ts,ts);
    });
  }
  function draw(){
    const W=bc.width=window.innerWidth, H=bc.height=window.innerHeight;
    bx.imageSmoothingEnabled=false;
    bx.fillStyle='#5c94fc'; bx.fillRect(0,0,W,H);
    const groundH=Math.round(H*0.04), gy=H-groundH;
    if(img.complete&&img.naturalWidth>0){
      const cs=Math.round(W*0.055);
      drawCloud(W*0.12,H*0.1,cs);
      drawCloud(W*0.48,H*0.08,Math.round(cs*1.2));
      drawCloud(W*0.80,H*0.12,Math.round(cs*0.85));
      const gt=Math.round(groundH/2),cols=Math.ceil(W/gt)+1;
      for(let c=0;c<cols;c++) bx.drawImage(img,16,0,16,16,c*gt,gy,gt,gt);
      for(let c=0;c<cols;c++) bx.drawImage(img,0,0,16,16,c*gt,gy+gt,gt,gt);
    }
  }
  img.onload=draw; draw(); window.addEventListener('resize',draw);
})();

// ── Firebase ──────────────────────────────────────────────────
firebase.initializeApp({
  apiKey:    "AIzaSyBYsQCbHZ6r2KeqJ3-dgmFiR1mZ_IFZ-10",
  authDomain:"light-the-night-2025.firebaseapp.com",
  projectId: "light-the-night-2025"
});
const db = firebase.firestore();

// ── Helpers ───────────────────────────────────────────────────
function escHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(ms){
  if(!ms||ms<0) return '—';
  const s=Math.floor(ms/1000), m=Math.floor(s/60), r=s%60;
  return `${m}:${String(r).padStart(2,'0')}`;
}
function calcScore(coins){ return coins||0; }
function elapsedMs(item){
  const s=item.mazeStartTime?.toMillis?.()??0;
  const e=item.mazeEndTime?.toMillis?.()??0;
  return e-s;
}
function _addLandFields(d){
  const has=id=>Array.isArray(d.scans)&&d.scans.some(s=>s===id||(s&&s.station===id));
  return {...d,land_ice:has('land_ice'),land_water:has('land_water'),land_fire:has('land_fire'),land_lava:has('land_lava')};
}
function _scanHas(d,id){ return Array.isArray(d.scans)&&d.scans.some(s=>s===id||(s&&typeof s==='object'&&s.station===id)); }

// ── Seamless scroller factory ─────────────────────────────────
function makeScroller(wrapEl,innerEl){
  let pos=0,anim=null,looped=false;
  function start(){
    if(anim) cancelAnimationFrame(anim);
    function tick(){
      const half=innerEl.scrollHeight/2;
      pos+=0.5; if(half>0&&pos>=half) pos-=half;
      innerEl.style.transform=`translateY(-${pos}px)`;
      anim=requestAnimationFrame(tick);
    }
    anim=requestAnimationFrame(tick);
  }
  function stop(){
    if(anim){cancelAnimationFrame(anim);anim=null;}
    pos=0; looped=false; innerEl.style.transform='';
  }
  function maybeStart(){
    if(innerEl.scrollHeight>wrapEl.clientHeight){
      if(!looped){innerEl.innerHTML+=innerEl.innerHTML; looped=true;}
      start();
    } else { stop(); }
  }
  return {stop,maybeStart};
}

// ── Shared start-time anchor ──────────────────────────────────
const _kidStartMs={};

// ── Main ──────────────────────────────────────────────────────
firebase.auth().signInAnonymously().catch(()=>{});
firebase.auth().onAuthStateChanged(user=>{
  if(!user) return;

  const imInner  = document.getElementById('imInner');
  const imCount  = document.getElementById('imCount');
  const imScroll = document.getElementById('imScroll');
  const lbInner  = document.getElementById('lbInner');
  const lbCount  = document.getElementById('lbCount');
  const lbScroll = document.getElementById('lbScroll');

  const imScroller = makeScroller(imScroll,imInner);
  const lbScroller = makeScroller(lbScroll,lbInner);

  let _eventFilter = null;
  let _allKidsRaw  = [];
  let imKids       = [];
  let lbCommitted  = [], lbPending = [];

  // ── In-maze render ────────────────────────────────────────
  function renderIM(){
    const now = Date.now();
    const vis = _eventFilter ? imKids.filter(k=>k.eventId===_eventFilter) : imKids;
    const inMaze = vis
      .filter(k=>k.mazeStartTime&&!k.mazeEndTime)
      .sort((a,b)=>{
        const aMs=_kidStartMs[a.id]?.localMs??now;
        const bMs=_kidStartMs[b.id]?.localMs??now;
        return bMs-aMs; // lowest elapsed first
      });

    imCount.textContent = inMaze.length;

    if(!inMaze.length){
      imScroller.stop();
      imInner.innerHTML='<div class="empty-msg">Nobody in the maze yet…</div>';
      return;
    }

    imScroller.stop();
    imInner.innerHTML = inMaze.map(k=>{
      const startMs = _kidStartMs[k.id]?.localMs??now;
      const powerups=[
        _scanHas(k,'land_ice')   ?`<span title="Ice Land">🧊</span>`   :'',
        _scanHas(k,'land_water') ?`<span title="Water Land">🌊</span>` :'',
        _scanHas(k,'land_fire')  ?`<span title="Fire Land">🔥</span>`  :'',
        _scanHas(k,'land_lava')  ?`<span title="Lava Land">🌋</span>`  :'',
        k.savedPeach                             ?`<img src="icons/princess_peach.png" alt="Peach">`:'',
        (k.collectedMushroom||k.usedMushroom)    ?`<img src="icons/mushroom.png" alt="Mushroom">`:'',
        (k.collectedShell||k.usedShell)          ?`<img src="icons/red_shell.webp" alt="Shell">`:'',
      ].filter(Boolean).join('');
      return `<div class="im-row" data-start="${startMs}">
        <div class="im-dot"></div>
        <div class="im-name">${escHtml(k.name||'?')}</div>
        ${powerups?`<div class="im-powerups">${powerups}</div>`:''}
        <div class="im-coins"><img src="coin.svg" style="height:1em;width:auto;vertical-align:middle;image-rendering:pixelated"> ${k.coins??0}</div>
        <div class="im-elapsed">${fmtTime(now-startMs)}</div>
      </div>`;
    }).join('');
    requestAnimationFrame(()=>imScroller.maybeStart());
  }

  // Tick elapsed every second
  setInterval(()=>{
    imInner.querySelectorAll('[data-start]').forEach(row=>{
      const ts=parseInt(row.dataset.start,10);
      const el=row.querySelector('.im-elapsed');
      if(el) el.textContent=fmtTime(isNaN(ts)?0:Date.now()-ts);
    });
  },1000);

  // ── Finisher helpers ──────────────────────────────────────
  function buildLbRow(item,rank){
    const cls=['gold','silver','bronze'][rank]||'';
    const rankStr=rank===0?'🥇':rank===1?'🥈':rank===2?'🥉':`#${rank+1}`;
    const s=item.mazeStartTime?.toMillis?.()??0;
    const e=item.mazeEndTime?.toMillis?.()??0;
    const badges=[
      item.land_ice   ?`<span class="lb-badge lb-badge-emoji">🧊</span>`:'',
      item.land_water ?`<span class="lb-badge lb-badge-emoji">🌊</span>`:'',
      item.land_fire  ?`<span class="lb-badge lb-badge-emoji">🔥</span>`:'',
      item.land_lava  ?`<span class="lb-badge lb-badge-emoji">🌋</span>`:'',
      item.savedPeach                                    ?`<span class="lb-badge"><img src="icons/princess_peach.png" alt="Peach"></span>`:'',
      (item.collectedShell||item.usedShell)              ?`<span class="lb-badge"><img src="icons/red_shell.webp" alt="Shell"></span>`:'',
      (item.collectedMushroom||item.usedMushroom)        ?`<span class="lb-badge"><img src="icons/mushroom.png" alt="Mushroom"></span>`:'',
    ].filter(Boolean).join('');
    const el=document.createElement('div');
    el.className=`lb-row${cls?' '+cls:''}`;
    el.dataset.id=item.id;
    el.innerHTML=`<div class="lb-rank ${rank<3?'r'+(rank+1):'other'}">${rankStr}</div>`
      +`<div class="lb-name">${escHtml(item.name||'?')}</div>`
      +(badges?`<div class="lb-badges">${badges}</div>`:'')
      +`<div class="lb-coins"><img src="coin.svg" style="height:1em;width:auto;vertical-align:middle;image-rendering:pixelated"> ${item.coins??0}</div>`
      +`<div class="lb-time">${fmtTime(e-s)}</div>`;
    return el;
  }

  function _calcLbRank(item){
    return lbCommitted.filter(c=>
      c.score>item.score||
      (c.score===item.score&&elapsedMs(c)<elapsedMs(item))||
      (c.score===item.score&&elapsedMs(c)===elapsedMs(item)&&(c.name||'')<(item.name||''))
    ).length;
  }

  function rebuildLbDOM(){
    lbInner.innerHTML=lbCommitted.map((k,i)=>buildLbRow(k,i).outerHTML).join('');
  }

  function _tryProcessLbQueue(){
    if(!lbPending.length) return;
    while(lbPending.length){
      const{item}=lbPending.shift();
      lbCommitted.splice(_calcLbRank(item),0,item);
    }
    lbCount.textContent=lbCommitted.length;
    lbScroller.stop();
    rebuildLbDOM();
    requestAnimationFrame(()=>lbScroller.maybeStart());
  }

  function initLbRender(kids){
    const finishers=kids
      .filter(k=>k.mazeEndTime)
      .map(k=>({..._addLandFields(k),score:calcScore(k.coins)}))
      .sort((a,b)=>b.score-a.score||elapsedMs(a)-elapsedMs(b)||(a.name||'').localeCompare(b.name||''));
    lbCommitted=finishers;
    lbCount.textContent=finishers.length;
    lbScroller.stop();
    if(!finishers.length){
      lbInner.innerHTML='<div class="empty-msg">No finishers yet…<br>Be the first!</div>';
      return;
    }
    rebuildLbDOM();
    requestAnimationFrame(()=>lbScroller.maybeStart());
  }

  // ── Config listener ───────────────────────────────────────
  db.collection('config').doc('config').onSnapshot(snap=>{
    const newFilter=(snap.data()||{}).lbEventFilter||null;
    if(newFilter!==_eventFilter){
      _eventFilter=newFilter;
      if(_allKidsRaw.length){
        const vis=_eventFilter?_allKidsRaw.filter(k=>k.eventId===_eventFilter):_allKidsRaw;
        lbCommitted=[];lbPending=[];
        initLbRender(vis);
        renderIM();
      }
    }
  });

  // ── Reload broadcast ──────────────────────────────────────
  let _reloadTs=Number(sessionStorage.getItem('ltn_slb_reload_ts')||0);
  db.collection('config').doc('leaderboardReloadBroadcast').onSnapshot(snap=>{
    if(!snap.exists) return;
    const ts=snap.data().triggeredAt?.toMillis?.()??null;
    if(!ts||ts===_reloadTs) return;
    _reloadTs=ts;
    sessionStorage.setItem('ltn_slb_reload_ts',ts);
    if(Date.now()-ts>30000) return;
    setTimeout(()=>location.reload(),500);
  });

  // ── Kids listener ─────────────────────────────────────────
  let _firstSnap=true;
  db.collection('kids').onSnapshot(snap=>{
    const snapNow=Date.now();

    // Rebuild in-maze state from full snapshot every time
    _allKidsRaw=[]; imKids=[];
    snap.forEach(doc=>{
      const d=doc.data();
      if(d.revoked) return;
      const kid={id:doc.id,...d};
      _allKidsRaw.push(kid);
      imKids.push(kid);
      if(d.mazeStartTime&&!d.mazeEndTime){
        const serverMs=d.mazeStartTime?.toMillis?.()??0;
        const prev=_kidStartMs[doc.id];
        if(!prev||prev.serverMs!==serverMs){
          const localMs=serverMs>0&&serverMs<=snapNow?serverMs:snapNow;
          _kidStartMs[doc.id]={serverMs,localMs};
        }
      } else {
        delete _kidStartMs[doc.id];
      }
    });

    renderIM();

    if(_firstSnap){
      _firstSnap=false;
      const vis=_eventFilter?_allKidsRaw.filter(k=>k.eventId===_eventFilter):_allKidsRaw;
      initLbRender(vis);
      return;
    }

    // Handle finisher-panel changes
    let lbNeedsRebuild=false;
    snap.docChanges().forEach(change=>{
      const id=change.doc.id;

      if(change.type==='removed'){
        if(lbCommitted.some(c=>c.id===id)) lbNeedsRebuild=true;
        return;
      }

      const d=change.doc.data();

      if(change.type==='modified'&&!d.mazeEndTime){
        if(lbCommitted.some(c=>c.id===id)) lbNeedsRebuild=true;
        return;
      }

      if(!d.mazeEndTime||d.revoked) return;
      if(_eventFilter&&d.eventId!==_eventFilter) return;

      // Already on leaderboard — update in place
      const existingIdx=lbCommitted.findIndex(c=>c.id===id);
      if(existingIdx!==-1){
        lbCommitted[existingIdx]={
          ...lbCommitted[existingIdx],
          coins:d.coins??lbCommitted[existingIdx].coins,
          savedPeach:!!d.savedPeach,
          collectedShell:!!(d.collectedShell||d.usedShell),
          usedShell:!!d.usedShell,
          collectedMushroom:!!(d.collectedMushroom||d.usedMushroom),
          usedMushroom:!!d.usedMushroom,
          land_ice:   _scanHas(d,'land_ice'),
          land_water: _scanHas(d,'land_water'),
          land_fire:  _scanHas(d,'land_fire'),
          land_lava:  _scanHas(d,'land_lava'),
          score:calcScore(d.coins)
        };
        lbInner.querySelectorAll(`.lb-row[data-id="${id}"]`).forEach(row=>{
          row.replaceWith(buildLbRow(lbCommitted[existingIdx],existingIdx));
        });
        return;
      }

      if(lbPending.some(p=>p.item.id===id)) return;

      const item={
        id,name:d.name,coins:d.coins||0,
        mazeStartTime:d.mazeStartTime,mazeEndTime:d.mazeEndTime,
        savedPeach:!!d.savedPeach,
        collectedMushroom:!!(d.collectedMushroom||d.usedMushroom),
        usedMushroom:!!d.usedMushroom,
        collectedShell:!!(d.collectedShell||d.usedShell),
        usedShell:!!d.usedShell,
        land_ice:   _scanHas(d,'land_ice'),
        land_water: _scanHas(d,'land_water'),
        land_fire:  _scanHas(d,'land_fire'),
        land_lava:  _scanHas(d,'land_lava'),
        score:calcScore(d.coins)
      };
      lbPending.push({item});
      _tryProcessLbQueue();
    });

    if(lbNeedsRebuild){
      const vis=_eventFilter?_allKidsRaw.filter(k=>k.eventId===_eventFilter):_allKidsRaw;
      lbCommitted=[];lbPending=[];
      initLbRender(vis);
    }
  });
});
</script>
