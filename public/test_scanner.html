<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Test Scanner (Minimal)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <link rel="icon" href="data:,">
  <!-- ZXing fallback -->
  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
  <style>
    :root{ --bg:#000014; --panel:#0c1226; --ink:#e8f7ff; --muted:#9fb6c9; --accent:#22d3ee; --line:#1b2a56; }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .wrap{max-width:560px;margin:0 auto;padding:16px}
    h1{font-size:18px;margin:0 0 12px 0}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
    .controls{display:flex;gap:8px;flex-wrap:wrap}
    .btn{flex:1 0 auto;padding:12px 14px;border-radius:10px;border:1px solid #16445a;background:#0b2238;color:#bfefff;font-weight:800;cursor:pointer}
    .btn.secondary{opacity:.8}
    .status{font-size:13px;color:var(--muted);margin-top:8px}
    .label{font-size:12px;color:var(--muted);margin-bottom:6px}
    .out{font-family:ui-monospace, Menlo, Monaco, Consolas, "Courier New", monospace; background:#07132a;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:38px}
    .stage{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden}
    video{width:100%;height:56.25vw;max-height:58vh;object-fit:cover;display:block;background:#000}
    .brackets{position:absolute;inset:8% 6%;pointer-events:none}
    .corner{position:absolute;width:42px;height:42px;border:3px solid rgba(34,211,238,.95)}
    .tl{left:-3px;top:-3px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
    .tr{right:-3px;top:-3px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
    .br{right:-3px;bottom:-3px;border-left:0;border-top:0;border-radius:0 0 10px 0}
    .bl{left:-3px;bottom:-3px;border-right:0;border-top:0;border-radius:0 0 0 10px}
    .scanline{position:absolute;left:10%;right:10%;height:2px;background:rgba(34,211,238,.6);top:12%;
      animation:sl 2.2s linear infinite;box-shadow:0 0 8px rgba(34,211,238,.8)}
    @keyframes sl{0%{top:12%}50%{top:88%}100%{top:12%}}
    .hint{font-size:12px;color:var(--muted);margin-top:8px}
    .list{max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px;background:#07132a}
    .row{padding:6px 4px;border-bottom:1px dashed #14305a;font-family:ui-monospace, Menlo, Monaco, Consolas, "Courier New", monospace;}
    .row:last-child{border-bottom:0}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🔎 Test Scanner (Minimal)</h1>

    <div class="card">
      <div class="label">Camera</div>
      <div class="controls">
        <button id="btnFront" class="btn">Use Front</button>
        <button id="btnBack" class="btn">Use Back</button>
        <button id="btnStart" class="btn">Start Scan</button>
        <button id="btnStop" class="btn secondary">Stop</button>
        <button id="btnClear" class="btn secondary">Clear Log</button>
      </div>
      <div class="status" id="status">Status: idle</div>
    </div>

    <div class="card">
      <div class="stage">
        <video id="video" autoplay muted playsinline></video>
        <div class="brackets">
          <div class="corner tl"></div><div class="corner tr"></div>
          <div class="corner br"></div><div class="corner bl"></div>
        </div>
        <div class="scanline"></div>
      </div>
      <div class="hint">Tip: On iOS, add to Home Screen for smoother camera. Needs HTTPS (or localhost).</div>
    </div>

    <div class="card">
      <div class="label">Last decoded</div>
      <div id="last" class="out">—</div>
      <div class="label" style="margin-top:10px;">Last extracted LTN code</div>
      <div id="lastCode" class="out">—</div>
      <div class="label" style="margin-top:10px;">Recent scans</div>
      <div id="log" class="list"></div>
      <div class="hint">Press “T” on keyboard to simulate: <code>... ?code=LTN-2025-ACM6-L2TJ</code></div>
    </div>
  </div>

  <!-- Offscreen canvas for ZXing canvas fallback -->
  <canvas id="zxCanvas" width="1280" height="720" style="display:none"></canvas>

  <script>
    // ======== Simple helpers ========
    const $ = id => document.getElementById(id);
    const statusEl = $('status'), videoEl = $('video'), logEl = $('log');
    const lastEl = $('last'), lastCodeEl = $('lastCode');
    const canvasEl = $('zxCanvas'); const ctx = canvasEl.getContext('2d', { willReadFrequently:true });

    function setStatus(s){ statusEl.textContent = 'Status: ' + s; }
    function addLog(text){
      const div = document.createElement('div'); div.className='row';
      div.textContent = new Date().toLocaleTimeString() + '  ' + text;
      logEl.prepend(div);
    }

    // ======== Beep (no external audio) ========
    let audCtx = null;
    function beep(){
      try{
        audCtx = audCtx || new (window.AudioContext||window.webkitAudioContext)();
        const o = audCtx.createOscillator(), g = audCtx.createGain();
        o.type='sine'; o.frequency.value=880; g.gain.value=0.25; o.connect(g); g.connect(audCtx.destination);
        o.start(); setTimeout(()=>o.stop(), 120);
      }catch(_){}
    }

    // ======== Code extraction ========
    const LTN_RE = /LTN-2025-[A-Z0-9]{4}-[A-Z0-9]{4}/i;
    function extractCode(raw){
      const s = String(raw||'').trim();
      try{
        const u = new URL(s);
        const qp = u.searchParams.get('code');
        if (qp) return qp.trim().toUpperCase();
      }catch(_){}
      const m = s.match(LTN_RE);
      if (m && m[0]) return m[0].toUpperCase();
      return ''; // not an LTN payload
    }

    // ======== Media selection ========
    let preferFront = false;
    async function listVideoInputs(){
      const devs = await navigator.mediaDevices.enumerateDevices();
      return devs.filter(d=>d.kind==='videoinput').map(d=>({id:d.deviceId,label:d.label||''}));
    }
    function looksFront(label){ return /front|user|facetime|true.?depth/i.test(label||''); }
    async function pickDeviceId(){
      const ins = await listVideoInputs();
      const front = ins.find(v=>looksFront(v.label));
      const back  = ins.find(v=>!looksFront(v.label));
      if (preferFront && front) return front.id;
      if (!preferFront && back) return back.id;
      return (ins[0]?.id) || null;
    }

    // ======== Scanner engine (Detector → ZXing stream → ZXing canvas) ========
    let scanning = false, detector = null, zxingReader = null, scanRAF = 0, canvasLoopFn = null, lastText='', lastBeepAt=0;

    function stopMedia(){
      try{ const s = videoEl.srcObject; if (s) s.getTracks().forEach(t=>t.stop()); videoEl.srcObject=null; }catch{}
    }
    function cancelAnim(){ if (scanRAF){ cancelAnimationFrame(scanRAF); scanRAF=0; } }
    function stopCanvasLoop(){
      if (canvasLoopFn && canvasLoopFn.stop) canvasLoopFn.stop(); canvasLoopFn=null;
    }
    async function startCamera(){
      stopMedia();
      const deviceId = await pickDeviceId();
      const constraints = deviceId ? {
        video:{ deviceId:{exact:deviceId}, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:60,max:60}, advanced:[{focusMode:"continuous"}] },
        audio:false
      } : {
        video:{ facingMode: preferFront?{ideal:'user'}:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:60,max:60}, advanced:[{focusMode:"continuous"}] },
        audio:false
      };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      videoEl.srcObject = stream;
      await new Promise(res => { if (videoEl.readyState>=2) return res(); videoEl.onloadedmetadata=res; });
      await videoEl.play().catch(()=>{});
    }

    async function startScan(){
      scanning = true; lastText=''; lastBeepAt=0;
      cancelAnim(); stopCanvasLoop();

      try{
        await startCamera();
      }catch(e){
        setStatus('Camera error. Use HTTPS and allow camera');
        addLog('Camera error: ' + (e.message||e));
        return;
      }
      setStatus('Scanning…');

      if ('BarcodeDetector' in window){
        try{
          detector = new BarcodeDetector({ formats:[
            'qr_code','code_128','code_39','code_93','ean_13','upc_a','upc_e','data_matrix','aztec','itf'
          ]});
          loopDetect();
          return;
        }catch(_){}
      }

      if (window.ZXing && ZXing.BrowserMultiFormatReader){
        if (!zxingReader) zxingReader = new ZXing.BrowserMultiFormatReader();
        try{
          if (typeof zxingReader.decodeFromVideoElementContinuously === 'function'){
            zxingReader.decodeFromVideoElementContinuously(videoEl, (result, err)=>{
              if (!scanning) return;
              if (result && result.text) onDecoded(result.text);
            });
            return;
          }
        }catch(_){}
      }

      startCanvasZXing();
    }

    function loopDetect(){
      if (!scanning || !detector) return;
      const tick = async ()=>{
        try{
          const codes = await detector.detect(videoEl);
          if (codes && codes.length){
            const best = codes.reduce((a,b)=> (b.rawValue?.length||0) > (a.rawValue?.length||0) ? b : a);
            if (best?.rawValue) onDecoded(best.rawValue);
          }
        }catch(_){}
        scanRAF = requestAnimationFrame(tick);
      };
      scanRAF = requestAnimationFrame(tick);
    }

    function startCanvasZXing(){
      if (!window.ZXing || !ZXing.BrowserMultiFormatReader) return;
      if (!zxingReader) zxingReader = new ZXing.BrowserMultiFormatReader();
      const ww = videoEl.videoWidth || 1280, hh = videoEl.videoHeight || 720;
      canvasEl.width = ww; canvasEl.height = hh;
      let active = true;

      canvasLoopFn = async function loop(){
        if (!active || !scanning) return;
        try{
          ctx.drawImage(videoEl,0,0,ww,hh);
          const res = await zxingReader.decodeFromCanvas(canvasEl);
          if (res && res.text) onDecoded(res.text);
        }catch(_){}
        setTimeout(loop, 100);
      };
      canvasLoopFn.stop = ()=>{ active=false; };
      canvasLoopFn();
    }

    function stopScan(){
      scanning = false;
      cancelAnim();
      stopCanvasLoop();
      if (zxingReader){ try{ zxingReader.reset(); }catch{} }
      stopMedia();
      setStatus('stopped');
    }

    // ======== Decoded handler (debounced) ========
    function onDecoded(text){
      const t = String(text||'').trim();
      if (!t) return;
      if (t === lastText && Date.now() - lastBeepAt < 550) return;
      lastText = t; lastBeepAt = Date.now();

      beep();
      lastEl.textContent = t;
      addLog('RAW: ' + t);

      const code = extractCode(t);
      if (code){
        lastCodeEl.textContent = code;
        addLog('LTN: ' + code);
      }else{
        lastCodeEl.textContent = '— (non-LTN payload)';
      }
    }

    // ======== UI wiring ========
    $('btnFront').onclick = ()=>{ preferFront = true; setStatus('front selected'); };
    $('btnBack').onclick  = ()=>{ preferFront = false; setStatus('back selected'); };
    $('btnStart').onclick = ()=> startScan();
    $('btnStop').onclick  = ()=> stopScan();
    $('btnClear').onclick = ()=>{ logEl.innerHTML=''; lastEl.textContent='—'; lastCodeEl.textContent='—'; };

    // Key "T" to inject a test URL with code
    document.addEventListener('keydown', e=>{
      if ((e.key||'').toLowerCase() === 't'){
        const test = 'https://light-the-night-2025.web.app/participant.html?code=LTN-2025-ACM6-L2TJ';
        onDecoded(test);
      }
    });

    // iOS: resume camera after tab switch
    document.addEventListener('visibilitychange', ()=>{
      if (document.visibilityState === 'visible' && scanning){
        stopScan();
        startScan();
      }
    });

    // Ask for permissions early (optional)
    (async function primePerms(){
      try{ await navigator.mediaDevices.getUserMedia({video:true,audio:false}).then(s=>s.getTracks().forEach(t=>t.stop())); }catch(_){}
    })();
  </script>
</body>
</html>
