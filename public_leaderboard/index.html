<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png"/>
  <title>Leaderboard — Light the Night 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000040;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      height: 100vh;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Underground brick texture */
    body::before {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(255,255,255,0.04) 31px, rgba(255,255,255,0.04) 32px),
        repeating-linear-gradient(90deg, transparent, transparent 63px, rgba(255,255,255,0.04) 63px, rgba(255,255,255,0.04) 64px);
    }

    /* Ground bar */
    body::after {
      content: '';
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 16px;
      background: #c8601c;
      border-top: 3px solid #231207;
      z-index: 10;
    }

    /* ── Header ── */
    .page-header {
      position: relative; z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 24px 10px;
      gap: 20px;
      flex-shrink: 0;
    }

    .page-title {
      font-size: clamp(1rem, 3vw, 1.6rem);
      color: #e8a000;
      text-shadow: 3px 3px 0 #231207, -1px -1px 0 #231207;
      letter-spacing: 2px;
      text-align: center;
    }

    /* ── Two-column layout ── */
    .columns {
      position: relative; z-index: 1;
      display: flex;
      flex: 1;
      gap: 0;
      overflow: hidden;
      padding: 0 0 24px;
    }

    .col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 0 16px;
    }

    .col + .col {
      border-left: 3px solid rgba(232,160,0,0.25);
    }

    .col-header {
      font-size: clamp(0.55rem, 1.4vw, 0.75rem);
      color: #e8a000;
      text-shadow: 2px 2px 0 #231207;
      text-align: center;
      padding: 6px 0 10px;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .col-count {
      font-family: 'Inter', sans-serif;
      font-size: clamp(11px, 1.6vw, 14px);
      color: rgba(255,255,255,0.5);
      text-align: center;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .col-list {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-bottom: 8px;
    }

    /* ── Entry rows ── */
    .entry {
      padding: 8px 12px;
      border: 2px solid #231207;
      box-shadow: 3px 3px 0 #231207;
      border-radius: 4px;
      font-family: 'Inter', sans-serif;
      font-size: clamp(11px, 1.5vw, 14px);
      background: rgba(0,0,64,0.8);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .entry-rank {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(9px, 1.1vw, 12px);
      min-width: 28px;
      flex-shrink: 0;
    }

    .entry-name {
      flex: 1;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entry-coins {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(9px, 1.1vw, 12px);
      color: #e8a000;
    }

    .entry-coins img {
      height: 1.1em;
      width: auto;
      image-rendering: pixelated;
    }

    .entry-sub {
      font-size: clamp(9px, 1vw, 11px);
      color: rgba(255,255,255,0.45);
      flex-shrink: 0;
    }

    /* Medal rows */
    .entry.first  { background: rgba(232,160,0,0.18); border-color: #e8a000; box-shadow: 3px 3px 0 #7a5400; }
    .entry.second { background: rgba(192,192,192,0.14); border-color: #c0c0c0; box-shadow: 3px 3px 0 #555; }
    .entry.third  { background: rgba(205,127,50,0.18); border-color: #cd7f32; box-shadow: 3px 3px 0 #6b3d0a; }
    .entry.in-maze-entry { background: rgba(0,80,0,0.35); border-color: rgba(76,255,80,0.3); }

    .empty-msg {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(0.5rem, 1.2vw, 0.7rem);
      color: rgba(255,255,255,0.3);
      text-align: center;
      padding: 24px 8px;
      line-height: 2.2;
    }

    .divider {
      width: 2px;
      background: rgba(232,160,0,0.2);
      align-self: stretch;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <canvas id="starsCanvas" style="position:fixed;top:0;left:0;z-index:-1;pointer-events:none;"></canvas>

  <div class="page-header">
    <div class="page-title">⭐ Light the Night 2026 ⭐</div>
  </div>

  <div class="columns">
    <!-- LEFT: In Maze -->
    <div class="col">
      <div class="col-header">🌟 IN MAZE</div>
      <div class="col-count" id="inMazeCount">—</div>
      <div class="col-list" id="inMazeList">
        <div class="empty-msg">Nobody in the maze yet...</div>
      </div>
    </div>

    <!-- RIGHT: Finishers -->
    <div class="col">
      <div class="col-header">🏁 FINISHERS</div>
      <div class="col-count" id="finisherCount">—</div>
      <div class="col-list" id="finisherList">
        <div class="empty-msg">No finishers yet...<br>be first!</div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBYsQCbHZ6r2KeqJ3-dgmFiR1mZ_IFZ-10",
      authDomain: "light-the-night-2025.firebaseapp.com",
      projectId: "light-the-night-2025"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    firebase.auth().signInAnonymously().catch(()=>{});

    const finisherListEl  = document.getElementById('finisherList');
    const inMazeListEl    = document.getElementById('inMazeList');
    const finisherCountEl = document.getElementById('finisherCount');
    const inMazeCountEl   = document.getElementById('inMazeCount');

    function fmtTime(ms) {
      if (!ms || ms < 0) return '';
      const totalSec = Math.floor(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${m}:${String(s).padStart(2,'0')}`;
    }

    const COIN_SVG = `<img src="https://light-the-night.web.app/coin.svg" alt="">`;

    let _lbReloadTs = Number(sessionStorage.getItem('ltn_lb_reload_ts') || 0);
    db.collection('config').doc('leaderboardReloadBroadcast').onSnapshot(snap => {
      if (!snap.exists) return;
      const ts = snap.data().triggeredAt ? snap.data().triggeredAt.toMillis() : null;
      if (!ts || ts === _lbReloadTs) return;
      _lbReloadTs = ts;
      sessionStorage.setItem('ltn_lb_reload_ts', ts);
      if (Date.now() - ts > 30000) return;
      setTimeout(() => location.reload(), 500);
    });

    db.collection('kids').onSnapshot(snapshot => {
      const finishers = [];
      const inMaze = [];

      snapshot.forEach(doc => {
        const d = doc.data();
        if (!d || d.revoked) return;
        const name = d.name || 'Player';
        const coins = d.coins || 0;

        if (d.completed && d.mazeEndTime) {
          const durationMs = d.durationMs ||
            (d.mazeStartTime && d.mazeEndTime
              ? d.mazeEndTime.toMillis() - d.mazeStartTime.toMillis()
              : null);
          finishers.push({ name, coins, durationMs });
        } else if (d.mazeStartTime) {
          const scans = Array.isArray(d.scans) ? d.scans.length : 0;
          inMaze.push({ name, coins, scans });
        }
      });

      // Sort finishers: coins desc, time asc
      finishers.sort((a, b) =>
        b.coins - a.coins ||
        (a.durationMs ?? Infinity) - (b.durationMs ?? Infinity) ||
        a.name.localeCompare(b.name)
      );

      // Sort in-maze: coins desc
      inMaze.sort((a, b) => b.coins - a.coins || a.name.localeCompare(b.name));

      // Render finishers
      finisherCountEl.textContent = finishers.length + (finishers.length === 1 ? ' finisher' : ' finishers');
      if (finishers.length === 0) {
        finisherListEl.innerHTML = '<div class="empty-msg">No finishers yet...<br>be first!</div>';
      } else {
        finisherListEl.innerHTML = finishers.map((f, i) => {
          const rankStr = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`;
          const cls = i === 0 ? ' first' : i === 1 ? ' second' : i === 2 ? ' third' : '';
          const timeStr = f.durationMs ? `<span class="entry-sub">${fmtTime(f.durationMs)}</span>` : '';
          return `<div class="entry${cls}">
            <span class="entry-rank">${rankStr}</span>
            <span class="entry-name">${escHtml(f.name)}</span>
            ${timeStr}
            <span class="entry-coins">${COIN_SVG}${f.coins}</span>
          </div>`;
        }).join('');
      }

      // Render in-maze
      inMazeCountEl.textContent = inMaze.length + ' in maze';
      if (inMaze.length === 0) {
        inMazeListEl.innerHTML = '<div class="empty-msg">Nobody in the maze yet...</div>';
      } else {
        inMazeListEl.innerHTML = inMaze.map(p => `
          <div class="entry in-maze-entry">
            <span class="entry-name">${escHtml(p.name)}</span>
            <span class="entry-coins">${COIN_SVG}${p.coins}</span>
          </div>`).join('');
      }
    });

    function escHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>

  <!-- Starfield -->
  <script>
    const canvas = document.getElementById('starsCanvas');
    const ctx = canvas.getContext('2d');
    const DPR = Math.max(1, window.devicePixelRatio || 1);
    let W, H;

    function resizeCanvas() {
      W = Math.floor(window.innerWidth);
      H = Math.floor(window.innerHeight);
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const stars = Array.from({ length: 400 }, () => ({
      x: (Math.random() - 0.5) * 1920,
      y: (Math.random() - 0.5) * 1080,
      z: Math.random() * 1920,
      radius: Math.random() * 1.5 + 0.5
    }));

    const shootingStars = [];
    let nextSpawn = performance.now() + (Math.random() * 2300 + 1200);

    function spawnShootingStar() {
      const speed = (Math.random() * 400 + 700) / 1000;
      const angle = (Math.random() * 15 + 20) * (Math.PI / 180);
      const x = Math.random() * W * 0.5 - W * 0.1;
      const y = Math.random() * H * 0.3 - H * 0.2;
      shootingStars.push({
        x, y,
        vx: Math.cos(angle) * (Math.random() * 6 + 8) * speed,
        vy: Math.sin(angle) * (Math.random() * 6 + 8) * speed,
        length: Math.random() * 100 + 120,
        life: 0,
        maxLife: Math.random() * 700 + 700,
        width: Math.random() + 1.2
      });
    }

    function drawStars() {
      for (const s of stars) {
        s.z -= 2;
        if (s.z <= 0) s.z = W;
        const k = 128 / s.z;
        const x = W / 2 + s.x * k;
        const y = H / 2 + 50 + s.y * k;
        const r = Math.max(0.2, s.radius * (1 - s.z / W));
        const b = 120 + (1 - s.z / W) * 135;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, 2 * Math.PI);
        ctx.fillStyle = `rgb(${b},${b},${b})`;
        ctx.fill();
      }
    }

    function drawShootingStars(dt) {
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const m = shootingStars[i];
        m.life += dt;
        m.x += m.vx * (dt / 16.67);
        m.y += m.vy * (dt / 16.67);
        const alpha = Math.max(0, 1 - m.life / m.maxLife);
        const dx = -m.vx * (m.length / Math.hypot(m.vx, m.vy));
        const dy = -m.vy * (m.length / Math.hypot(m.vx, m.vy));
        ctx.save();
        ctx.globalAlpha = alpha * 0.6;
        ctx.lineWidth = m.width + 1.5; ctx.lineCap = 'round';
        ctx.shadowBlur = 18; ctx.shadowColor = '#e8a000';
        ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x + dx, m.y + dy);
        ctx.strokeStyle = 'rgba(232,160,0,0.9)'; ctx.stroke();
        ctx.restore();
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.lineWidth = m.width; ctx.lineCap = 'round';
        const grad = ctx.createLinearGradient(m.x, m.y, m.x + dx, m.y + dy);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.4, 'rgba(255,240,180,0.9)');
        grad.addColorStop(1, 'rgba(232,160,0,0)');
        ctx.strokeStyle = grad;
        ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x + dx, m.y + dy);
        ctx.stroke(); ctx.restore();
        if (m.life > m.maxLife || m.x > W + 100 || m.y > H + 100) {
          shootingStars.splice(i, 1);
        }
      }
    }

    let last = performance.now();
    function draw() {
      const now = performance.now();
      const dt = now - last; last = now;
      ctx.fillStyle = '#000040';
      ctx.fillRect(0, 0, W, H);
      drawStars();
      drawShootingStars(dt);
      if (now > nextSpawn) {
        spawnShootingStar();
        nextSpawn = now + Math.random() * 2300 + 900;
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
